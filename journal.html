<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journal de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* ============================================================
   Journal de bord — apparat critique
   minium = ouvert · outremer = interaction · verdet = achevé
   mono = dérivé de git/du parseur · sérif = écrit à la main
   ============================================================ */
:root{
  --verge:#E6E7E1; --plat:#FAFAF7; --plat2:#F1F2ED;
  --encre:#14171B; --encre2:#4A5259; --encre3:#79828A;
  --minium:#B7332B; --outremer:#2B4C8C; --outremer-pale:#DFE5F2; --verdet:#3D7A5D;
  --pl-close-bg:#14171B; --pl-close-fg:#D6D8D1; --pl-close-fg2:#8F958F;
  --sr:'Newsreader',Charter,'Bitstream Charter',Georgia,serif;
  --mo:ui-monospace,'SF Mono','Cascadia Code',Consolas,'Liberation Mono',monospace;
  --t1:.6875rem; --t2:.8125rem; --t3:1rem; --t4:1.25rem; --t5:1.875rem;
  --gout:7.75rem;
}
@media (prefers-color-scheme:dark){:root{
  --verge:#101317; --plat:#191D22; --plat2:#20252B;
  --encre:#E4E6E0; --encre2:#A3ABB2; --encre3:#727B83;
  --minium:#E4685C; --outremer:#8CACEC; --outremer-pale:#1C2740; --verdet:#6FBC93;
  --pl-close-bg:#272D34; --pl-close-fg:#C6CAC4; --pl-close-fg2:#7E868D;
}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--verge);color:var(--encre);
  font:400 var(--t3)/1.6 var(--sr);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2.5px solid var(--outremer);outline-offset:2px;border-radius:2px}
a{color:var(--outremer)}

/* ---------- chrome ---------- */
.tete{background:var(--plat);border-bottom:2px solid var(--encre)}
.tete-in,.corps{max-width:64rem;margin:0 auto;padding:0 1.5rem}
.tete-in{padding-top:1.5rem}
.marque{display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap;margin:0}
.marque b{font:600 var(--t4)/1 var(--mo);letter-spacing:-.02em}
.branche{font:400 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.1em;
  color:var(--outremer);background:var(--outremer-pale);padding:.35em .6em;border-radius:2px}
/* Les journaux voisins, à côté de la branche. Volontairement plus discrets qu'elle : la
   branche dit où l'on est dans CE dépôt, les voisins disent qu'il en existe d'autres.
   Cible haute pour rester touchable au doigt, la barre étant la seule zone de navigation
   permanente de la page. */
.marque .sep{color:var(--encre3);opacity:.5}
.voisin{display:inline-flex;align-items:baseline;gap:.4em;text-decoration:none;
  font:400 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.1em;
  color:var(--encre2);border:1px solid var(--verge);border-radius:2px;
  padding:.5em .6em;margin-right:.3rem}
.voisin:hover{border-color:var(--outremer);color:var(--outremer)}
.voisin i{font-style:normal;font-variant-numeric:tabular-nums;color:var(--encre3);
  letter-spacing:.04em}
.etat{font:400 var(--t2)/1.5 var(--mo);color:var(--encre2);margin:.55rem 0 0}
/* L'export s'annonce, sans crier : c'est une nuance d'état, pas une alerte. La case figée
   garde sa coche lisible mais perd son air cliquable. */
.fige-bandeau{font:400 var(--t2)/1.5 var(--mo);color:var(--encre3);margin:.35rem 0 0}
.case.fige input{opacity:.55;cursor:default}
.case.fige label{cursor:default}
.ong{display:flex;gap:.25rem;margin-top:1.1rem}
.ong a{font:500 var(--t2)/1 var(--mo);text-decoration:none;color:var(--encre2);
  padding:.6rem .9rem;border-radius:2px 2px 0 0;background:var(--plat2)}
.ong a:hover{color:var(--encre)}
.ong a.on{background:var(--encre);color:var(--plat)}
.corps{padding-top:2.25rem;padding-bottom:6rem}

/* ---------- intitulés ---------- */
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  font:500 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.13em;
  color:var(--encre3);margin:2.75rem 0 .75rem}
.sec:first-child{margin-top:0}
.sec .n{font-variant-numeric:tabular-nums}

/* ---------- la plaque de sigle ---------- */
.plaque{background:var(--minium);color:#fff;padding:1rem .85rem;min-width:0;
  display:flex;flex-direction:column;justify-content:space-between;gap:.5rem}
.sigle{font:600 1.75rem/1 var(--mo);letter-spacing:-.045em;word-break:break-all}
.carte .sigle{font-size:var(--sig,1.75rem)}
.mesure{font:400 1.375rem/1 var(--mo);font-variant-numeric:tabular-nums}
.mesure i{font:400 var(--t1)/1 var(--mo);font-style:normal;opacity:.75;margin-left:.15em}
.mot{font:500 var(--t1)/1.3 var(--mo);text-transform:uppercase;letter-spacing:.11em;opacity:.82}
.s-dif .plaque{background:transparent;box-shadow:inset 0 0 0 2.5px var(--minium);color:var(--minium)}
/* « à venir » : rien n'a commencé. Pas le minium des chantiers vivants — l'outremer,
   qui n'appelle pas au secours mais annonce. */
.s-ven .plaque{background:var(--outremer)}
.s-clos .plaque,.s-liv .plaque{background:var(--pl-close-bg);color:var(--pl-close-fg)}
.s-clos .mot,.s-clos .mesure i,.s-liv .mesure i{color:var(--pl-close-fg2);opacity:1}
.s-liv .mot{color:var(--verdet);opacity:1}
/* « abandonné » : fermé pour de bon, donc la plaque éteinte des clos — mais surtout PAS
   le verdet de `livré`, qui dit « fait ». Le mot reste en gris de clôture : on a décidé
   de ne pas le faire, ce n'est ni une livraison ni un reliquat. */
.s-aba .plaque{background:var(--pl-close-bg);color:var(--pl-close-fg)}
.s-aba .mot,.s-aba .mesure i{color:var(--pl-close-fg2);opacity:1}

/* ---------- carte ---------- */
.pile{display:flex;flex-direction:column;gap:.375rem}
.carte{position:relative;display:grid;grid-template-columns:var(--gout) 1fr;
  background:var(--plat);border-radius:2px;overflow:hidden}
.carte:hover{background:var(--plat2)}
.carte:focus-within{outline:2.5px solid var(--outremer);outline-offset:2px}
/* nappe cliquable : évite d'imbriquer une ancre de carte autour des pastilles */
.cible{color:inherit;text-decoration:none}
.cible::after{content:"";position:absolute;inset:0}
.cible:focus-visible{outline:none}
.corps-c{padding:1rem 1.25rem;min-width:0;display:flex;flex-direction:column;gap:.35rem}
.titre-c{font:500 var(--t4)/1.3 var(--sr);margin:0;letter-spacing:-.01em}
.lemme{font:400 var(--t3)/1.5 var(--sr);color:var(--encre2);margin:0;overflow-wrap:break-word}
.pied{font:400 var(--t2)/1.4 var(--mo);color:var(--encre3);margin:.15rem 0 0;
  display:flex;gap:.9rem;flex-wrap:wrap}
.pied .r{color:var(--minium)}
.pied .r0{color:var(--verdet)}
.pied .fr{color:var(--encre3)}
.pied .fr.nf{color:var(--encre2);font-weight:500}

/* liste repliée */
.repli{display:flex;flex-wrap:wrap;gap:.375rem}
.repli a{font:500 var(--t2)/1 var(--mo);text-decoration:none;color:var(--pl-close-fg);
  background:var(--pl-close-bg);padding:.6rem .75rem;border-radius:2px}
.repli a:hover{color:#fff}
.repli a .v{color:var(--verdet)}
.repli a .nf{color:var(--pl-close-fg2)}
/* `abandonné` ne peut prendre ni le verdet de `.v` — il n'est pas fait — ni le gris de
   `.nf`, qui est celui d'un démenti. Ce n'en est pas un : c'est une décision. D'où une
   troisième forme, en capitales d'étiquette, qui ne se confond avec aucune des deux. */
.repli a .ab{font-size:var(--t1);text-transform:uppercase;letter-spacing:.09em;opacity:.7}

/* ---------- folio ---------- */
.retour{font:500 var(--t2)/1 var(--mo);text-decoration:none;color:var(--encre2);
  display:inline-block;margin-bottom:1.25rem}
.retour:hover{color:var(--outremer)}
.folio{display:grid;grid-template-columns:15rem 1fr;gap:2.5rem;align-items:start}
.apparat{position:sticky;top:1.25rem;display:flex;flex-direction:column;gap:.375rem}
.apparat .plaque{border-radius:2px;padding:1.15rem 1rem;gap:1.5rem}
.apparat .sigle{font-size:2.25rem}
.meta{margin:0;background:var(--plat);border-radius:2px;padding:.9rem 1rem;
  font:400 var(--t2)/1.45 var(--mo)}
.meta div{padding:.45rem 0}
.meta div+div{border-top:1px solid var(--plat2)}
.meta dt{font-size:var(--t1);text-transform:uppercase;letter-spacing:.1em;color:var(--encre3)}
.meta dd{margin:.25rem 0 0;overflow-wrap:break-word}
.titre-f{font:600 var(--t5)/1.15 var(--sr);letter-spacing:-.022em;margin:0 0 .9rem}
.lemme-f{font:400 1.125rem/1.55 var(--sr);margin:0;padding:.9rem 1.1rem;
  background:var(--plat);border-left:3px solid var(--minium);border-radius:0 2px 2px 0}
.s-clos .lemme-f,.s-liv .lemme-f,.s-aba .lemme-f{border-left-color:var(--pl-close-bg)}
.s-dif .lemme-f{border-left-style:double;border-left-width:5px}
.s-ven .lemme-f{border-left-color:var(--outremer)}
.lemme-f b{font:600 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.11em;
  color:var(--encre3);display:block;margin-bottom:.35rem}

/* ---------- traînée de commits ---------- */
/* Sous le point de reprise, pas dans le panneau latéral : c'est la ligne écrite qu'on
   lit d'abord, et l'écart avec les faits doit se voir sans bouger les yeux. */
.trainee{list-style:none;margin:.5rem 0 0;padding:0;display:flex;flex-direction:column}
.trainee li{display:grid;grid-template-columns:5rem 6.25rem 1fr;gap:.9rem;align-items:baseline;
  padding:.4rem 1.1rem;font:400 var(--t2)/1.5 var(--mo)}
.trainee li:first-child{padding-top:.55rem}
.trainee .t-h{color:var(--encre2)}
.trainee .t-d{color:var(--encre3);font-variant-numeric:tabular-nums}
.trainee .t-s{font:400 .9375rem/1.5 var(--sr);color:var(--encre);overflow-wrap:break-word}
.trainee li+li .t-s{color:var(--encre2)}

/* ---------- cases ---------- */
.cases{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.1875rem}
.case{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:start;
  background:var(--plat);border-radius:2px;padding:.7rem .95rem}
.case:hover{background:var(--plat2)}
.case input{appearance:none;-webkit-appearance:none;width:1.15rem;height:1.15rem;
  margin:.2rem 0 0;flex:none;border:2px solid var(--encre3);border-radius:2px;
  background:var(--verge);cursor:pointer}
.case input:hover{border-color:var(--verdet)}
.case input:checked{background:var(--verdet);border-color:var(--verdet)}
.case input:checked::after{content:"";display:block;width:.3rem;height:.6rem;
  margin:.08rem 0 0 .32rem;border:solid var(--plat);border-width:0 2.5px 2.5px 0;
  transform:rotate(43deg)}
.case label{font:400 var(--t3)/1.5 var(--sr);cursor:pointer;overflow-wrap:break-word}
.case input:checked~label{color:var(--encre3);text-decoration:line-through;
  text-decoration-color:var(--encre3);text-decoration-thickness:1px}

/* ---------- prose ---------- */
.prose{max-width:38rem}
.prose p{font:400 var(--t3)/1.7 var(--sr);color:var(--encre2);margin:0 0 .9rem}
.prose strong{font-weight:600;color:var(--encre)}
.prose code,.lemme code,.lemme-f code,.case code,.vide code{font:400 .85em/1 var(--mo);
  background:var(--plat2);padding:.15em .35em;border-radius:2px;color:var(--encre)}
/* Une table de fiche compare presque toujours des CHIFFRES — un avant/après, un seuil et
   sa mesure. D'où `tabular-nums` et l'alignement à droite des cellules purement
   numériques, qui met les ordres de grandeur les uns sous les autres. `max-width` est
   levée : la prose tient en 38rem pour la lecture, une table a besoin de sa largeur. */
.prose table{border-collapse:collapse;margin:0 0 1.1rem;font:400 var(--t2)/1.5 var(--sr);
  color:var(--encre2);width:100%;max-width:44rem}
.prose thead th{font:500 var(--t1)/1 var(--mo);text-transform:uppercase;
  letter-spacing:.09em;color:var(--encre3);text-align:left;padding:0 .8rem .45rem 0;
  border-bottom:1px solid var(--verge)}
.prose tbody td{padding:.45rem .8rem .45rem 0;border-bottom:1px solid var(--verge);
  vertical-align:baseline;font-variant-numeric:tabular-nums}
.prose tbody tr:last-child td{border-bottom:0}
.prose th:last-child,.prose td:last-child{padding-right:0}
/* Un bloc de code se lit et se COPIE : d'où le défilement horizontal plutôt que le
   repli, qui casserait le collage, et `white-space:pre` qui garde l'indentation.
   `max-width` levée pour la même raison que les tables — la mesure de lecture confortable
   ne s'applique pas à du code. La langue déclarée après ``` s'affiche en filigrane. */
.prose pre.bloc{position:relative;margin:0 0 1.1rem;padding:.85rem 1rem;
  background:var(--plat2);border:1px solid var(--verge);border-radius:3px;
  max-width:none;overflow-x:auto}
.prose pre.bloc code{display:block;white-space:pre;background:none;padding:0;
  font:400 var(--t2)/1.55 var(--mo);color:var(--encre)}
.prose pre.bloc[data-l]::before{content:attr(data-l);position:absolute;top:.35rem;
  right:.6rem;font:500 var(--t1)/1 var(--mo);text-transform:uppercase;
  letter-spacing:.1em;color:var(--encre3);pointer-events:none}
.zone{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  font:500 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.13em;
  color:var(--encre3);margin:2rem 0 .6rem}
.zone .n{font-weight:400;font-variant-numeric:tabular-nums;letter-spacing:.06em}

/* ---------- pastilles ---------- */
.pill{font:500 .875em/1 var(--mo);text-decoration:none;padding:.18em .4em;
  border-radius:2px;white-space:nowrap;position:relative;z-index:1}
.pill.i{color:var(--outremer);background:var(--outremer-pale)}
.pill.e{color:var(--encre2);background:var(--plat2);box-shadow:inset 0 -1px 0 var(--encre3)}
.pill:hover{filter:brightness(.94)}

/* ---------- fil ---------- */
.filtre{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-bottom:1.5rem}
.filtre label{font:500 var(--t1)/1 var(--mo);text-transform:uppercase;
  letter-spacing:.11em;color:var(--encre3)}
.filtre select{font:400 var(--t2)/1 var(--mo);color:var(--encre);background:var(--plat);
  border:2px solid var(--plat2);border-radius:2px;padding:.55rem .6rem;cursor:pointer}
.jour{font:500 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.13em;
  color:var(--plat);background:var(--encre);display:inline-block;
  padding:.5rem .75rem;border-radius:2px;margin:1.75rem 0 .5rem}
.cmts{display:flex;flex-direction:column;gap:.1875rem}
.cmt{display:grid;grid-template-columns:5.5rem 1fr;gap:.9rem;background:var(--plat);
  border-radius:2px;padding:.6rem .95rem;align-items:baseline}
/* ---------- en vol ---------- */
.vols{display:flex;flex-direction:column;gap:.1875rem}
.vol{display:grid;grid-template-columns:4.25rem 5.5rem 1fr auto;align-items:center;gap:1rem;
  background:var(--plat);border-radius:2px;padding:.7rem 1rem;text-decoration:none;color:inherit}
.vol:hover{background:var(--plat2)}
.vol:focus-visible{outline:2.5px solid var(--outremer);outline-offset:2px}
.v-n{font:400 1.125rem/1 var(--mo);font-variant-numeric:tabular-nums;text-align:right;color:var(--encre)}
.v-n i{font:400 var(--t1)/1 var(--mo);font-style:normal;color:var(--encre3);margin-left:.1em}
.v-j{height:.375rem;background:var(--verge);border-radius:1px;overflow:hidden}
.v-j i{display:block;height:100%;width:var(--p);background:var(--minium)}
.v-t{font:400 1.0625rem/1.35 var(--sr)}
.v-c .tr{font:400 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.1em;color:var(--encre3)}

/* ---------- tableau de bord ---------- */
.bord{display:flex;flex-direction:column;gap:.1875rem}
.b-l{display:grid;grid-template-columns:13rem 7rem 5.5rem 1fr;align-items:center;gap:1rem;
  background:var(--plat);border-radius:2px;padding:.7rem 1rem}
.b-k{font:400 var(--t2)/1.4 var(--mo);color:var(--encre2)}
.b-k code{font:inherit;color:var(--encre)}
.b-v{font:400 1.25rem/1 var(--mo);font-variant-numeric:tabular-nums;text-align:right;color:var(--encre)}
.b-v i{font:400 var(--t1)/1 var(--mo);font-style:normal;color:var(--encre3)}
.b-j{height:.375rem;background:var(--verge);border-radius:1px;overflow:hidden}
.b-j i{display:block;height:100%;width:var(--p);background:var(--encre3)}
.b-n{font:400 var(--t2)/1.4 var(--mo);color:var(--encre3)}
.b-n a{color:var(--outremer);text-decoration:none;border-bottom:1px solid transparent}
.b-n a:hover{border-bottom-color:currentColor}
.b-l.pres .b-v,.b-l.haut .b-v{color:var(--minium)}
.b-l.pres .b-j i,.b-l.haut .b-j i{background:var(--minium)}
.b-l.haut{box-shadow:inset 2.5px 0 0 var(--minium)}
.avs{display:flex;flex-direction:column;gap:.1875rem;margin-top:.5rem}
/* Même surface que les autres lignes : `plat2` aurait paru plus discret en clair
   mais plus voyant en sombre, où il est la teinte la plus claire des trois. Le
   second rang se tient donc par la typographie, pas par le fond. */
.av{display:grid;grid-template-columns:2rem 1fr 11rem;gap:1rem;padding:.6rem 1rem;
  align-items:baseline;background:var(--plat);border-radius:2px;
  font:400 var(--t2)/1.45 var(--mo);color:var(--encre3)}
.av .a-n{text-align:right;font-variant-numeric:tabular-nums;color:var(--encre)}
.av .a-m{color:var(--encre2)}
.av .a-l{text-align:right}
.av a{color:var(--outremer);text-decoration:none;border-bottom:1px solid transparent}
.av a:hover{border-bottom-color:currentColor}
.av a i{font-style:normal;color:var(--encre3);margin-left:.25em}

/* Une pastille ne se coupe pas — c est ce qu on veut d un code court, pas d un chemin
   de document. Mesuré : un nom de 34 caractères débordait de 34 px du panneau latéral,
   qui fait 208 px de contenu. La pastille de chemin s autorise donc la coupure ; elle
   reste une pastille, elle cesse d être insécable. */
.pill.doc{white-space:normal;overflow-wrap:anywhere}

/* Le serveur relit `journal.html` à chaque requête, jamais son propre code : après une
   mise à jour, un processus laissé en marche sert la vue NEUVE avec un moteur ANCIEN.
   Les champs manquants passent alors pour des données vides — une frise sans une seule
   barre, triée par ordre alphabétique faute de dates. Ça s'est produit une fois, et rien
   ne le disait. */
.perime{background:var(--minium);color:var(--plat);padding:.7rem 1rem;border-radius:2px;
  margin:0 0 1.2rem;font:400 var(--t2)/1.5 var(--mo)}
.perime b{font-weight:600}

/* La barre de carte : un segment posé sur une piste pleine largeur, sous le pied. Elle
   ne porte ni axe ni mois — c'est la comparaison d'une carte à l'autre qui informe.

   La PISTE doit se voir autant que le segment, et c'est tout l'enjeu : une barre seule,
   au bas d'une carte, se lit comme une jauge de progression. « R3, de 45 à 99 % » se
   comprendrait « presque fini » alors que R3 porte dix-huit restes. Une piste visible de
   bord à bord, identique sur toutes les cartes, avec deux extrémités marquées, dit que
   le segment est POSÉ quelque part et non qu'il REMPLIT depuis la gauche.

   La couleur suit le texte (currentColor) plutôt qu'un ton fixe : la piste suit le texte, donc les deux thèmes,
   et ne se confond pas avec le fond de la carte comme le faisait --verge. */
.mini{display:block;position:relative;height:9px;margin:.6rem 0 0}
.mini::before{content:"";position:absolute;left:0;right:0;top:3px;height:3px;
  border-radius:2px;background:currentColor;opacity:.13}
.mini::after{content:"";position:absolute;left:0;right:0;top:0;height:9px;
  border-left:1px solid currentColor;border-right:1px solid currentColor;opacity:.22}
.mini>span{position:absolute;top:3px;height:3px;border-radius:2px;background:var(--minium)}
.s-clos .mini>span,.s-liv .mini>span,.s-aba .mini>span{background:var(--pl-close-bg)}
.s-ven .mini>span{background:var(--outremer)}
.s-dif .mini>span{background:var(--minium);opacity:.6}

/* ---- frise ---- */
/* Pas de SVG : une piste en position relative et des barres en pourcentage. Un SVG en
   largeur 100 % dans une colonne qui se dimensionne sur son contenu se résout en rond
   et disparaît — déjà payé sur les courbes de masse. */
.frise{margin:0 0 1.6rem}
.fr-corps{position:relative}
.fr-fond{position:absolute;inset:0 0 0 var(--gout);pointer-events:none}
/* `--verge` sert AUSSI de fond de page : le trait y était de la couleur exacte du fond,
   donc présent dans le DOM et invisible à l écran. Compter les traits ne prouvait rien —
   il fallait relever leur couleur. `currentColor` suit le texte, donc les deux thèmes. */
.fr-mois{position:absolute;top:0;bottom:0;width:1px;background:currentColor;opacity:.13}
.fr-l{display:grid;grid-template-columns:var(--gout) 1fr;align-items:center;
  min-height:1.55rem;position:relative}
.fr-l+.fr-l{margin-top:.1rem}
.fr-c{font:500 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.09em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:.6rem}
.fr-t{position:relative;height:1.55rem}
.fr-b{position:absolute;top:.42rem;height:.7rem;min-width:3px;border-radius:2px;
  background:var(--minium)}
.s-clos .fr-b,.s-liv .fr-b,.s-aba .fr-b{background:var(--pl-close-bg)}
.s-ven .fr-b{background:var(--outremer)}
/* La fiche et l'audit sont des instants, pas des durées : un trait fin, pas une barre.
   Le losange de la fiche se distingue du trait de l'audit sans recourir à la couleur. */
/* Centrés sur leur date, pas accrochés par le bord gauche : un repère posé par son
   bord se lit APRÈS l'instant qu'il marque, et déborde de la piste aux dernières dates
   — mesuré, deux marques hors piste à 700 px de large. */
.fr-f,.fr-a{position:absolute;top:.3rem;height:.95rem;width:1px;background:var(--encre3);
  transform:translateX(-50%)}
.fr-f{transform:translateX(-50%) rotate(45deg);height:.5rem;width:.5rem;top:.5rem;
  background:none;box-shadow:inset 0 0 0 1.5px var(--encre3);border-radius:1px}
.fr-a{background:var(--outremer);width:2px}
/* La passe se range sous son chantier : retrait, trait plus fin, teinte pâle — elle
   accompagne la ligne au-dessus au lieu de rivaliser avec elle. */
.fr-lp{min-height:1.2rem}
.fr-lp .fr-c{padding-left:.7rem;font-size:.625rem;text-transform:none;letter-spacing:.02em;
  color:var(--encre3);font-weight:400}
.fr-lp .fr-t{height:1.2rem}
/* Une passe est le plus souvent un INSTANT, pas une durée : écrite et rejouée dans la
   même semaine, sa barre tombe à 3 px sur un axe de cent jours — mesuré, six sur huit.
   Elle est donc dessinée pour être lisible en point comme en barre : plus haute, plus
   large au minimum, et pleine plutôt que cernée. */
.fr-q{position:absolute;top:.4rem;height:.42rem;min-width:7px;border-radius:3px;
  background:var(--outremer);opacity:.5}
/* Hors champ : le repère est antérieur au premier commit et se tient au bord gauche.
   Creux plutôt que plein — il dit « avant », pas « ici ». */
/* Collé au bord, pas centré : un repère hors champ n'a pas de position réelle à
   marquer, et le centrage le faisait dépasser de sa piste par la gauche. */
.fr-avant{opacity:.55;transform:none}
.fr-f.fr-avant{transform:rotate(45deg)}
.fr-a.fr-avant{background:none;box-shadow:inset 0 0 0 1px var(--outremer);width:4px;
  border-radius:1px}
.fr-axe{display:grid;grid-template-columns:var(--gout) 1fr;margin-top:.35rem}
.fr-axe>div{position:relative;height:1rem}
.fr-m0{transform:none}
.fr-m{position:absolute;top:0;font:400 var(--t1)/1 var(--mo);color:var(--encre3);
  transform:translateX(-50%);white-space:nowrap}
/* MÊME géométrie que la frise, et ce n'est pas un détail d'esthétique. `.fr-fond` est
   encastré de la gouttière (`inset:0 0 0 var(--gout)`) parce que sur la frise la piste
   commence après la colonne des codes. Posé sur un bloc pleine largeur, il décalait les
   traits de mois de la courbe qu'ils sont censés jalonner — mesuré à l'écran : trait à
   1014 px quand la donnée tombait à 999, et l'écart atteint la gouttière entière, 124 px,
   au bord gauche. L'axe (`.fr-axe`) et les lignes par fiche (`.pg-l`) portaient déjà cette
   grille ; seules les deux grandes courbes en sortaient. */
.pg{display:grid;grid-template-columns:var(--gout) 1fr;position:relative;margin:.1rem 0 0}
.pg-g{display:block;width:100%;height:9rem}
.pg-tot{fill:var(--outremer-pale)}
.pg-fai{fill:var(--verdet);opacity:.8}
.pg-lig{fill:none;stroke:var(--encre3);stroke-width:1;vector-effect:non-scaling-stroke}
.pg-e{margin-top:.15rem}
.pg+.pg-cap{margin-top:.85rem}
.et-g{display:block;width:100%;height:3.25rem}
.et-ven{fill:var(--outremer)}
.et-ouv{fill:var(--minium)}
/* PAS `--pl-close-bg`, la teinte des plaques closes. Elle vaut #14171B en clair et
   #272D34 en sombre : sur un fond de page a #101317, une AIRE de cette taille disparait
   -- verifie a l'ecran, la bande des fermes etait indiscernable du fond et la rouge
   semblait flotter. La teinte convient a une barre de trois pixels sur la frise, pas a
   un aplat. `--encre2` s'inverse avec le theme et contraste des deux cotes. */
.et-fer{fill:var(--encre2)}
.pg-cap{font:500 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.09em;
  color:var(--encre3);margin:0 0 .3rem}
.pg-cap i{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;
  margin-left:.5rem;opacity:.85}
.pb{margin-top:.75rem}
.pb-in{position:relative;height:var(--rangs)}
.pb-t{position:absolute;width:1px;background:var(--encre3);opacity:.5}
.pb-x{position:absolute;display:block;text-decoration:none;background:var(--plat);
  border-left:2.5px solid var(--encre3);padding:.3rem .45rem;border-radius:1px;
  font:400 var(--t1)/1.35 var(--mo);color:var(--encre2);overflow:hidden;
  /* Plafond et non hauteur ferme : depuis que le descriptif ne va qu'à la dernière boîte
     d'une fiche, les autres sont bien plus courtes et une hauteur imposée les remplissait
     de vide. Le plafond garde le rang infranchissable. */
  max-height:calc(var(--hr) - .55rem)}
.pb-x b{display:block;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.pb-x b a{color:var(--encre);text-decoration:none}
.pb-x b a:hover{text-decoration:underline}
.pb-p{display:block}
.pb-p i{font-style:normal;opacity:.55}
.pb-d,.pb-n{display:block;color:var(--encre3)}
.pb-ti{display:block;color:var(--encre2);font-family:var(--sr);font-size:.75rem;
  line-height:1.3;margin:.15rem 0}
/* Coupée à l'AFFICHAGE et non à la source. Tronquer le markdown avant de le rendre
   tranchait au milieu d'un `code` ou d'un **gras** : `ligne()` produisait alors des
   balises non refermées, et la prose du point de reprise s'échappait de la boîte pour
   se répandre sur la bande — vu à l'écran, trois pastilles flottant hors de toute
   carte. Le navigateur, lui, coupe des LIGNES, jamais du balisage. */
.pb-a{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;
  color:var(--encre3);font-family:var(--sr);font-size:.7rem;line-height:1.35;margin:.15rem 0}
.pb-a a{color:inherit;text-decoration:none}
.pb-ven{border-left-color:var(--outremer)}
.pb-ouv{border-left-color:var(--minium)}
.pb-fer{border-left-color:var(--encre2)}
.pg-liste{margin:.9rem 0 0}
.pg-l{display:grid;grid-template-columns:var(--gout) 1fr;align-items:center;min-height:1.25rem}
.pg-l+.pg-l{margin-top:.12rem}
.pg-c{font:400 .625rem/1 var(--mo);color:var(--encre2);text-decoration:none;padding-right:.55rem;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.pg-ch{font-weight:500;text-transform:uppercase;letter-spacing:.09em;color:var(--outremer)}
.pg-p{position:relative;display:grid;grid-template-columns:1fr auto;align-items:center;gap:.5rem}
.pg-s{display:block;width:100%;height:1.15rem}
.pg-n{font:400 var(--t1)/1 var(--mo);color:var(--encre3);font-style:normal;
  min-width:4.2rem;text-align:right}
.fr-leg{font:400 var(--t1)/1.5 var(--mo);color:var(--encre3);margin:.9rem 0 0}
.fr-leg b{font-weight:500;color:var(--encre2)}
@media (max-width:900px){
  .fr-l,.fr-axe,.pg{grid-template-columns:4.2rem 1fr}
  .fr-fond{inset:0 0 0 4.2rem}
}
.masses{width:100%;border-collapse:collapse;font:400 var(--t2)/1.4 var(--mo)}
.masses th{font:500 var(--t1)/1 var(--mo);text-transform:uppercase;letter-spacing:.1em;
  color:var(--encre3);text-align:right;padding:0 0 .55rem;font-weight:500}
.masses th:first-child,.masses td.a{text-align:left}
.masses td{background:var(--plat);padding:.5rem .8rem;vertical-align:middle}
.masses tr td:first-child{border-radius:2px 0 0 2px}
.masses tr td:last-child{border-radius:0 2px 2px 0}
.masses tbody tr+tr td{border-top:1px solid var(--verge)}
/* le nom prend le mou, courbe et chiffres restent collés à droite */
.masses td.a{width:100%}
.masses td.v{width:1%}
.masses td.v{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;
  color:var(--encre2)}
.masses td.v.moins{color:var(--verdet);font-weight:500}
.masses td.c{padding:0 .8rem}
/* largeur en dur : dans une colonne qui se rétrécit sur son contenu, un width:100%
   sur le SVG se résout circulairement et la courbe disparaît. */
.spark{display:block;width:132px;height:26px;overflow:visible}
.spark polyline{fill:none;stroke:var(--minium);stroke-width:1.5;
  vector-effect:non-scaling-stroke;stroke-linejoin:round}
.cmt.jal .h{color:var(--verdet);text-align:right}
.cmt.jal .s i{display:block;font:400 var(--t1)/1.6 var(--mo);font-style:normal;color:var(--encre3)}
.cmt .h{font:400 var(--t2)/1.5 var(--mo);color:var(--encre3)}
.cmt .s{font:400 .9375rem/1.5 var(--sr);overflow-wrap:break-word}

/* ---------- boutons, vides, toast ---------- */
.bt{font:500 var(--t2)/1 var(--mo);color:var(--plat);background:var(--encre);
  border:0;border-radius:2px;padding:.6rem .85rem;cursor:pointer}
.bt:hover{background:var(--encre2)}
.bt.danger{background:var(--minium);color:#fff}
.vide{background:var(--plat);border-radius:2px;padding:1.75rem;max-width:38rem}
.vide p{font:400 var(--t3)/1.6 var(--sr);color:var(--encre2);margin:0 0 .6rem}
.vide p:last-child{margin:0}
.vide b{font-weight:600;color:var(--encre)}
.toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);
  font:500 var(--t2)/1.4 var(--mo);background:var(--encre);color:var(--plat);
  padding:.75rem 1.1rem;border-radius:2px;opacity:0;pointer-events:none;
  transition:opacity .18s;max-width:calc(100vw - 3rem)}
.toast.on{opacity:1}
.toast.ko{background:var(--minium);color:#fff}

/* ---------- responsive ---------- */
/* Le tableau de bord garde ses colonnes fixes (13+7+5,5rem) : mesurée, sa colonne
   de note tombe à 69 px de large à 602 px de fenêtre et la ligne passe de 42 à
   113 px de haut. Elle ne retrouve sa pleine largeur qu'au-delà de 1020. */
@media (max-width:900px){
  .b-l{grid-template-columns:1fr auto;gap:.3rem .8rem}
  .b-l .b-j,.b-l .b-n{grid-column:1/-1}
  /* Même mesure pour les avertissements : à 602 px la colonne de liens garde
     11rem en fixe et le message s'empile sur quatre lignes dans 282 px. */
  .av{grid-template-columns:2rem 1fr;gap:.25rem .8rem}
  .av .a-l{grid-column:2;text-align:left}
}
@media (max-width:760px){
  .folio{grid-template-columns:1fr;gap:1.5rem}
  .apparat{position:static}
  .titre-f{font-size:1.5rem}
}
@media (max-width:560px){
  .tete-in,.corps{padding-left:1rem;padding-right:1rem}
  .carte{grid-template-columns:1fr}
  .plaque,.apparat .plaque{flex-direction:row;align-items:baseline;gap:.75rem;
    padding:.7rem .95rem}
  .carte .sigle,.apparat .sigle{font-size:1.375rem}
  .mesure{font-size:1rem}
  .mot{margin-left:auto;text-align:right}
  .cmt{grid-template-columns:1fr;gap:.15rem}
  .ong a{padding:.55rem .7rem}
  /* Les bandes ajoutées les 21-22 août avaient des colonnes fixes et aucune règle
     étroite : à 430 px le corps de page défilait latéralement. Mesuré à la capture,
     invisible au clavier. */
  .vol{grid-template-columns:4.25rem 1fr;gap:.45rem .8rem}
  .vol .v-j{grid-column:1/-1;order:3}
  .vol .v-c{grid-column:1/-1;order:4}
  .trainee li{grid-template-columns:5rem 1fr;gap:.2rem .8rem;padding:.5rem .95rem}
  .trainee .t-s{grid-column:1/-1}
  .masses td.c{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
