<body>

<header class="tete">
  <div class="tete-in">
    <p class="marque"><b id="repo">…</b><span class="branche" id="br">…</span><span id="voisins"></span></p>
    <p class="etat" id="sil"></p>
    <nav class="ong" id="tabs">
      <a href="#/">chantiers</a><a href="#/qa">passes</a><a href="#/frise">frise</a><a href="#/progression">progression</a><a href="#/masses">masses</a><a href="#/fil">fil</a>
    </nav>
  </div>
</header>

<main id="vue" class="corps"></main>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
let D = null, RXL = null;

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

/* Sur un export, `vscode://` désignerait un chemin absolu de la machine qui a EXPORTÉ :
   au mieux mort chez le lecteur, au pire ouvrant un autre fichier chez qui a la même
   arborescence. L'adresse web du dépôt, dérivée du remote à l'export, vaut mieux — elle
   ouvre le bon fichier à la bonne révision, chez n'importe qui. Sans remote, on rend un
   texte inerte plutôt qu'un lien qui ment. */
const vsc = p => D.statique
  ? (D.web ? D.web + p : "")
  : `vscode://file/${D.racine.replace(/\\/g, "/")}/${p}`;

/* pastilles — posées APRÈS échappement ; un code absent de liens reste du texte */
const RX_META = /[.*+?^${}()|[\]\\]/g;

function pastilles(html){
  if (!D) return html;
  if (!RXL){
    const k = Object.keys(D.liens).sort((a, b) => b.length - a.length)
      .map(x => x.replace(/[.*+?^${}()|[\]\\-]/g, "\\$&"));
    RXL = k.length ? new RegExp(`(^|[^\\w-])(${k.join("|")})(?![\\w-])`, "g") : /$^/;
  }
  html = html.replace(RXL, (m, pre, code) => {
    const cible = D.liens[code];
    if (!cible) return m;
    return cible.startsWith("#")
      ? `${pre}<a class="pill i" href="${cible}">${code}</a>`
      : `${pre}<a class="pill e" href="${vsc(cible)}">${code}</a>`;
  });
  /* Le dossier de documentation vient du serveur. Le coder ici en dur était la dernière
     fuite de grammaire dans la vue, qui ne lit pas la config du dépôt. */
  const dos = (D.docs || "docs").replace(RX_META, "\\$&");
  return html.replace(new RegExp("(^|[^\\w/-])(" + dos + "/[\\w.\\-]+\\.md)", "g"),
    (m, pre, p) => `${pre}<a class="pill e doc" href="${vsc(p)}">${p.slice(dos.length + 1)}</a>`);
}

const inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>")
                     .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
const ligne = t => pastilles(inline(esc(t)));
/* Un tableau markdown est le seul bloc de la prose dont les RETOURS À LA LIGNE portent du
   sens. `prose` les remplaçait par des espaces — comme pour tout paragraphe — et rendait
   la table en une file de barres verticales, ligne de séparation `|---|---|` comprise.
   Mesuré le 2026-08-27 : six fiches d'un dépôt réel, 58 lignes de tableau, toutes
   illisibles. Le rédacteur qui pose une table le fait justement là où la prose échoue —
   une comparaison chiffrée, un avant/après — donc c'est le passage le plus dense qui
   était le plus abîmé.

   On ne rend pas tout markdown pour autant : reconnaître un bloc dont CHAQUE ligne est
   une rangée, c'est sûr et local. `esc` a déjà couru, les barres sont donc intactes. */
const estTable = lignes => lignes.length >= 2 && lignes.every(l => l.trim().startsWith("|"))
  && /^\|[\s:|-]+\|$/.test(lignes[1].trim());
const cellules = l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => inline(c.trim()));
const table = lignes => {
  const [tete, , ...corps] = lignes;
  return `<table><thead><tr>${cellules(tete).map(c => `<th>${c}</th>`).join("")}</tr></thead>`
    + `<tbody>${corps.map(l => `<tr>${cellules(l).map(c => `<td>${c}</td>`).join("")}</tr>`)
        .join("")}</tbody></table>`;
};
const paragraphes = md => pastilles(esc(md).split(/\n{2,}/).filter(p => p.trim()).map(p => {
  const lignes = p.split("\n").filter(l => l.trim());
  return estTable(lignes) ? table(lignes) : "<p>" + inline(p.replace(/\n/g, " ")) + "</p>";
}).join(""));

/* Le second endroit où les retours à la ligne portent du sens, et le plus littéral : un
   bloc clôturé par ```. Il sortait en paragraphes, lignes repliées et clôtures visibles
   en toutes lettres. Le cas qui l'a montré est une sonde de console — soixante-dix lignes
   de JavaScript écrites pour être COLLÉES : rendues ainsi, elles étaient incollables, ce
   qui vide la passe de son sens.

   Deux différences avec le reste de la prose, et ce sont les deux raisons d'un chemin
   séparé plutôt que d'un cas de plus dans le découpage par lignes vides : un bloc de code
   CONTIENT des lignes vides, donc il faut l'extraire avant de découper ; et `pastilles`
   ne doit pas y courir — sinon un `R6` dans du code deviendrait un lien vers une fiche.
   Aucun bloc du dépôt mesuré n'est dans ce cas aujourd'hui (seul `_TEMPLATE.md`, que
   l'outil ignore), mais la garde ne coûte rien et le piège se referme tout seul. */
const FENCE = /^```([^\n]*)\n([\s\S]*?)^```[ \t]*$/gm;
const bloc = (langue, source) =>
  `<pre class="bloc"${langue ? ` data-l="${esc(langue)}"` : ""}>`
  + `<code>${esc(source.replace(/\n$/, ""))}</code></pre>`;

const prose = md => {
  // Normalisé d'abord : en CRLF, le `\r` colle au nom de langage et la clôture ne
  // reconnaît plus sa propre ligne. Les dossiers mélangent les deux fins de ligne.
  const t = String(md).replace(/\r\n/g, "\n");
  const bouts = [];
  let i = 0;
  for (const m of t.matchAll(FENCE)) {
    if (m.index > i) bouts.push(paragraphes(t.slice(i, m.index)));
    bouts.push(bloc(m[1].trim(), m[2]));
    i = m.index + m[0].length;
  }
  // Un bloc jamais refermé ne matche pas : tout retombe dans le chemin prose, ce qui
  // reste lisible. On préfère ça à une clôture devinée.
  if (i < t.length) bouts.push(paragraphes(t.slice(i)));
  return bouts.join("");
};

const OUVERT = s => s === "à venir" || s === "interrompu" || s === "différé";
const SLUG = { "à venir":"ven", "interrompu":"int", "différé":"dif", "clos":"clos", "livré":"liv", "abandonné":"aba" };
const slug = s => SLUG[s] || "int";
/* Un statut déclaré que git dément. Deux cas, un seul principe : la fiche affirme
   quelque chose de mesurable, et la mesure dit le contraire. On montre l'écart plutôt
   que d'arbitrer.
   · `à venir` — la fiche annonce que rien n'a commencé, et des commits qui citent son
     code touchent autre chose que la doc et `pilotage/`.
   · `livré` — c'est de l'INTÉGRATION, et le front la mesure déjà. Une fiche livrée dont
     le dernier commit ne vit sur aucune ref d'intégration annonce une livraison que le
     dépôt ne montre pas. Reproduit le 2026-08-26 : `livré` déclaré, dernier commit sur
     `feat/r9`, et l'écran rangeait la fiche « Clos et livrés » sans un mot.
   Sans front mesuré — un `livré` sans aucun commit — on se tait, comme pour un
   `Arrêté sur` sans dernier : ne rien savoir n'est pas un démenti.
   `différé` et `abandonné` n'en ont pas, et c'est délibéré : il leur faudrait la date de
   la mise en attente ou de l'abandon, que la fiche ne porte pas (voir STATUTS). */
const dementi = c => (c.statut === "à venir" && c.commitsCode > 0)
                  || (c.statut === "livré" && c.front && !c.front.integre);
const ditDementi = c => c.statut === "livré"
  ? `hors de ${(D.refs || []).join(", ")}`
  : `${c.commitsCode} commit${c.commitsCode > 1 ? "s" : ""} de code`;
/* La portée d'un audit : combien le code a bougé sous lui depuis qu'il est écrit.
   Elle ne dit JAMAIS qu'un constat est réglé — aucune mesure ne peut le dire. Elle dit
   que le sol a bougé, donc qu'il faut relire avant de planifier. D'où « à relire » et
   jamais « périmé » : le second trancherait sur le fond.
   Zéro chemin et zéro commit ne se ressemblent pas et ne doivent pas se lire pareil —
   mesuré, un audit qui parle de comportements plutôt que de fichiers ne rend qu'un seul
   chemin, et son zéro voudrait dire « je n'ai pas su regarder ». */
const ditPortee = (p) => {
  if (!p) return null;
  if (p.echec) return "mesure impossible — la commande git a échoué";
  if (!p.chemins) return "aucun chemin reconnu dans ce document — mouvement <b>inconnu</b>, pas nul";
  const ou = `sur ${p.chemins} chemin${p.chemins > 1 ? "s" : ""} cité${p.chemins > 1 ? "s" : ""}`;
  if (!p.commits) return `aucun mouvement ${ou} depuis le ${jour(p.depuis)}`;
  return `<b>${p.commits.toLocaleString("fr-FR")} commits</b> ${ou}, depuis le ${jour(p.depuis)}
    <i>+${p.plus.toLocaleString("fr-FR")} −${p.moins.toLocaleString("fr-FR")}</i>`
    + (p.tronque ? " — compte partiel, trop de chemins pour une seule mesure" : "");
};

/* À relire : le sol a bougé ET il reste des constats ouverts dessus. L'un sans l'autre
   ne change rien à ce qu'on fait — un audit remué mais soldé est de l'histoire, un audit
   intact garde ses constats valables.
   Le compte porte sur les DOCUMENTS, pas sur les fiches : quatre chantiers partageaient
   le même audit et le faisaient compter quatre fois. On le relit une fois pour les quatre. */
const aRelire = () => {
  const par = new Map();
  for (const c of D.chantiers) {
    const a = D.controle?.audits?.[c.audit];
    if (!(c.portee?.commits > 0 && a?.reconnu && a.total > 0)) continue;
    const e = par.get(c.audit) || { audit: c.audit, portee: c.portee, ouverts: a.total, codes: [] };
    e.codes.push(c.code);
    par.set(c.audit, e);
  }
  return [...par.values()].sort((x, y) => y.portee.commits - x.portee.commits);
};

/* Les collisions : combien de fichiers deux chantiers ont touchés en commun. L'état de
   l'autre est dit avec le nombre, parce qu'il le retourne — 29 fichiers partagés avec un
   chantier livré, c'est un terrain stabilisé qu'on retrouvera tel quel ; 20 avec un
   chantier qui a bougé ce matin, c'est un risque présent. On montre l'état plutôt que
   d'en fabriquer une pondération : le lecteur sait ce que « livré » veut dire chez lui. */
const ditCollisions = (l) => l.slice(0, 3).map(x => {
  const ferme = x.statut === "clos" || x.statut === "livré" || x.statut === "abandonné";
  const etat = ferme ? esc(x.statut)
    : x.silence === null ? "jamais commencé"
    : `${x.silence} j de silence`;
  // Parenthèses : sans elles, « R5 20 4 j de silence » colle deux nombres qui ne parlent
  // pas de la même chose.
  return `<a href="#/c/${encodeURIComponent(x.code)}">${esc(x.code)}</a>
    <b>${x.n}</b> <i>(${etat})</i>`;
}).join(" · ");

/* Un champ que seule une version récente du serveur produit. On ne compare pas des
   numéros de version — il faudrait les tenir à jour des deux côtés — mais la présence de
   ce que la page a besoin de lire.

   La sentinelle visait `ficheDate`, de deux générations en arrière : un serveur lancé
   avant le sélecteur de journaux avait ce champ, passait donc pour à jour, et servait la
   vue neuve SANS `voisins` — le sélecteur disparaissait en silence. Constaté sur un vrai
   couple de journaux le 2026-08-31 : l'un voyait l'autre, l'inverse non.
   La leçon n'est pas « déplacer la sentinelle une fois » mais qu'elle vieillit à chaque
   champ ajouté, et que rien ne le rappelle. À repointer avec le prochain.

   Repointée sur `progression` le 2026-09-02, en appliquant la consigne ci-dessus. Elle
   tient les deux cas limites : un dépôt sans historique de dossier rend un tableau VIDE
   et non l'absence du champ, et l'export statique le recopie tel quel. `voisins`, lui,
   reste vidé plutôt que supprimé par l'export — mais il n'est plus la sentinelle. */
/* Ré-armée à chaque champ ajouté : elle doit nommer le plus RÉCENT, sans quoi un moteur
   d'hier sert la vue d'aujourd'hui sans que rien ne le dise. `passages` succède ici à
   `progression` — un moteur qui a le second sans le premier existe (7e39f67), et c'est
   `passages`, précisément, dont l'absence viderait l'onglet Progression. */
const serveurPerime = () => D.passages === undefined;

const bandePerime = () => !serveurPerime() ? "" :
  `<p class="perime"><b>Le serveur tourne sur une version antérieure de
   <code>journal.mjs</code>.</b> La page est à jour, le moteur non : il relit le HTML à
   chaque requête mais jamais son propre code. Les dates, la portée des audits et les
   collisions manquent, et l'écran les montre comme si elles étaient vides. Arrête le
   processus et relance-le.</p>`;

/* Le libellé vient du serveur (`arreteLibelle`) : la fiche dit « Point de départ » ou
   « Arrêté sur », et l'écran ne le redéduit pas — un `différé` n'a rien commencé mais
   n'est pas « à venir », et se voyait titrer « Arrêté sur ».

   Le repli n'est là que pour le moteur périmé : la sentinelle de `serveurPerime()` porte
   sur `ficheDate`, plus ancienne, donc un moteur intermédiaire sert le champ absent SANS
   déclencher le bandeau. Mieux vaut l'ancienne déduction — parfois fausse — qu'un
   `undefined` en capitales. */
const libelleDeduit = c => c.statut === "à venir" ? "Point de départ" : "Arrêté sur";

const byCode = c => D.chantiers.find(x => x.code === c);
const byFile = f => D.passes.find(p => p.file === f);
const jour = s => new Date(s + "T00:00:00")
  .toLocaleDateString("fr-FR", { weekday:"long", day:"numeric", month:"long" });
const sansCode = t => t.replace(/^\s*\S+\s*[—–]\s*/, "");
const vide = html => `<div class="vide">${html}</div>`;

/* la plaque : sigle, silence, statut. Rien d'autre. */
const taille = n => Math.min(1.75, Math.round(1010 / n) / 100);
const plaque = c => `<div class="plaque" style="--sig:${taille(c.code.length)}rem">
  <span class="sigle">${esc(c.code)}</span>
  <span class="mesure">${c.silence ?? "—"}<i>j</i></span>
  <span class="mot">${esc(c.statut)}</span></div>`;

/* ---------------- en vol + tableau de bord ---------------- */
/* Une passe est « en vol » si elle est entamée, ou armée depuis moins de deux jours
   actifs. 0/33 posée hier et 0/54 remise à zéro il y a cinq jours sont deux états
   différents : le second dort. Le seuil est en jours ACTIFS, comme le silence d'un
   chantier — en jours calendaires, une passe armée un vendredi mourait le lundi. */
const ARME = 2;
const enVol = () => D.passes.filter(p =>
  (p.faits > 0 && p.faits < p.total) || (p.faits === 0 && p.silence !== null && p.silence <= ARME));

const rowVol = p => `<a class="vol" href="#/qa/${encodeURIComponent(p.file)}">
    <span class="v-n">${p.faits}<i>/ ${p.total}</i></span>
    <span class="v-j"><i style="--p:${p.total ? Math.round(p.faits / p.total * 100) : 0}%"></i></span>
    <span class="v-t">${esc(p.nom)}</span>
    <span class="v-c">${p.chantier
      ? `<span class="pill i">${esc(p.chantier)}</span>`
      : `<span class="tr">transversale</span>`}</span></a>`;

function bandeVol(){
  const l = enVol();
  if (!l.length) return "";
  const reste = l.reduce((n, p) => n + p.total - p.faits, 0);
  return `<h2 class="sec"><span>En vol</span><span class="n">${reste} points à cocher</span></h2>
    <div class="vols">${l.map(rowVol).join("")}</div>`;
}

/* Un chiffre n'entre ici que s'il peut être mauvais et que l'être change la suite.
   Un seul a un seuil réel — la veille. Les autres ont une direction : pas de jauge
   inventée pour faire joli. */
function bandeBord(){
  const v = D.veille, c = D.controle;
  if (!v && !c) return "";
  const l = [];

  /* Les liens vivent dans la note, pas sur la ligne entière : une ancre autour d'une
     ligne qui contient déjà des ancres se fait démonter par le parseur — déjà vu sur
     les cartes le 19 août. */
  const versFiche = (code) => byCode(code)
    ? `<a href="#/c/${encodeURIComponent(code)}">${esc(code)}</a>` : esc(code);

  /* La première question posée à cet écran n'est pas « qu'est-ce qui traîne » mais « je
     reprends quoi ». Le tri des bacs y répond DÉJÀ le plus souvent, et c'est mesuré : sur
     les quatorze derniers jours actifs, DEUX seulement voient les chantiers touchés se
     répartir sur plusieurs bacs — les douze autres, tout est en tête d'une même section.
     Cette ligne ne paie donc que pour ces deux-là, plus le coup d'œil qui évite de lire
     des dates sur vingt cartes. Elle est délibérément une ligne de bandeau et non un
     encart : le gain mesuré ne justifiait pas un bloc à lui.

     Pas de seuil. `silence === 0` désigne le dernier jour où l'on a travaillé, pas les N
     derniers jours : il se recale seul, hier ou la semaine dernière. Choisir un N est
     exactement ce pour quoi le seuil de dormance a été coupé (P-7, « à reposer si le tri
     seul ne suffit pas »).

     La date est nommée plutôt que traduite en « aujourd'hui » : `silenceCourant` vaut
     **1** un jour qui porte des commits, parce qu'il arrondit un écart entre minuit UTC
     et l'heure courante. Vérifié le 2026-09-01, `dernierJour` valant ce jour même.

     Le jour est celui du dernier chantier OUVERT touché, et non `dernierJour`, qui est
     le dernier jour actif du dépôt. La première version prenait `silence === 0`, donc
     se mesurait au dépôt : cassée à la première épreuve, et par elle-même — le commit
     qui l'installait ne citait aucun chantier, a fait avancer le dernier jour actif d'un
     cran et a poussé tout le monde à `silence 1`. La ligne n'affichait plus rien. Ce
     n'est pas de la malchance : 74 commits sur 181 ne portent aucun code de chantier
     (la ligne « commits en vol sans fiche », juste en dessous, le compte), et n'importe
     lequel — tenue, verrou de dépendances, CI — vidait la ligne. Se caler sur les
     chantiers plutôt que sur le dépôt rend le geste insensible à ce qu'on n'a pas
     rattaché. */
  const ouverts = D.chantiers.filter(c => OUVERT(c.statut) && c.dernier);
  /* PAS `jour` : c'est le nom de la fonction globale qui met une date en toutes lettres,
     et `bandeBord` s'en sert plus bas. La déclarer ici la masquait sur toute la portée
     de la fonction — « jour is not a function », attrapé par le `catch` de `charger()`,
     qui affiche « Impossible de joindre le serveur » alors que le serveur répondait. */
  const seance = ouverts.reduce((m, c) => c.dernier.date > m ? c.dernier.date : m, "");
  const repris = ouverts.filter(c => c.dernier.date === seance);
  if (repris.length) l.push({ cle: "reprise", val: String(repris.length),
    note: `dernier travail sur un chantier, le ${jour(seance)} · `
        + repris.map(c => versFiche(c.code)).join(" ") });

  if (v) {
    const pc = Math.round(v.net / v.seuil * 100);
    l.push({ cle: `veille <code>${esc(v.fichier.split("/").pop())}</code>`,
      val: `${v.net > 0 ? "+" : ""}${v.net.toLocaleString("fr-FR")} <i>/ ${v.seuil}</i>`,
      etat: pc >= 100 ? "haut" : pc >= 75 ? "pres" : "",
      note: `${pc} % du budget, ${v.jours} jours glissants`
          + (v.chantier ? ` · ${versFiche(v.chantier)}` : ""),
      jauge: Math.min(100, Math.max(0, pc)) });
  }

  const vol = enVol(), file = vol.reduce((n, p) => n + p.total - p.faits, 0);
  const dort = D.passes.filter(p => !vol.includes(p)).reduce((n, p) => n + p.total - p.faits, 0);
  if (file || dort) l.push({ cle: "vérification en file", val: file.toLocaleString("fr-FR"),
    note: `<a href="#/qa">${vol.length} passe${vol.length > 1 ? "s" : ""} en vol</a>`
        + ` · ${dort} points au repos` });

  /* Le point de reprise est l'artefact le plus lu d'une fiche et le seul qui se
     périme sans bruit : il n'est faux que sur les chantiers actifs, exacts sur les
     dormants. On le compte plutôt que de compter sur l'œil.

     « Décalés », pas « périmés » — et ce n'est pas une nuance de style. Le contrôle
     exige le hash EXACT du dernier commit de code, donc il sur-déclenche par
     construction : une ligne écrite après ce commit mais citant autre chose (un
     commit de tenue, un merge) est signalée alors qu'elle est juste. Cette
     sur-sensibilité est le prix de la détection et non un défaut — l'alternative
     par date a été testée et rate le cas qui compte : une fiche avait été commitée
     DEUX FOIS après son dernier commit de code alors que son marqueur pointait
     encore deux mois en arrière. Un signal volontairement bruyant ne
     peut donc pas porter une étiquette qui tranche sur le fond : « périmé » dirait
     que le travail décrit est caduc, ce que la mesure ne montre jamais. Le nom
     interne (`arreteDecale`) disait déjà juste ; l'écran s'aligne dessus. */
  const dec = D.chantiers.filter(c => c.arreteDecale);
  if (dec.length) l.push({ cle: "points de reprise décalés", val: String(dec.length),
    note: `ne citent plus le dernier commit · ${dec.map(c => versFiche(c.code)).join(" ")}` });

  /* Même geste pour le seul autre champ déclaré que git puisse contredire : un
     chantier annoncé « à venir » sur lequel du code est déjà tombé. */
  const dem = D.chantiers.filter(dementi);
  if (dem.length) l.push({ cle: "« à venir » démentis", val: String(dem.length),
    note: `du code est déjà tombé · ${dem.map(c => versFiche(c.code)).join(" ")}` });

  /* Le seul autre endroit où un document déclaré se confronte à une mesure : l'audit
     sur lequel s'appuie un chantier, et le code qui a bougé sous lui depuis. */
  const rel = aRelire();
  if (rel.length) l.push({ cle: "audits à relire avant de planifier", val: String(rel.length),
    note: rel.slice(0, 3).map(e =>
      `${e.codes.map(versFiche).join(" ")} <i>${e.portee.commits} commits sous ${e.ouverts} constats</i>`
    ).join(" · ") });

  /* Le travail qu'aucune fiche ne peut montrer : des commits en vol dont le sujet ne
     cite aucun code, et qui touchent autre chose que le dossier et la documentation.
     Une branche entièrement couverte par ses chantiers ne paraît pas ici — elle n'a
     rien de mauvais à signaler, et la règle de cette bande est qu'un chiffre n'y entre
     que s'il peut l'être.
     Les sujets des premiers orphelins passent en infobulle : « 5 sans fiche » dit qu'il
     faut agir, pas SUR QUOI. */
  const brVol = (D.branches || []).filter(b => b.orphelins > 0);
  const perdus = brVol.reduce((n, b) => n + b.orphelins, 0);
  if (perdus) l.push({ cle: "commits en vol sans fiche", val: String(perdus),
    note: brVol.slice(0, 3).map(b =>
      `<span title="${esc(b.exemples.map(e => e.hash + "  " + e.sujet).join("\n"))}">${esc(b.nom)}</span>
       <i>${b.orphelins} sur ${b.avance}, jusqu'au ${jour(b.dernier.date)}</i>`).join(" · ") });

  /* Seul chiffre volontairement inerte : il est la somme des Reste de toutes les
     fiches, et sa destination est la liste qui suit déjà sur cet écran. */
  if (c?.nonCouvert) l.push({ cle: "items jamais confrontés", val: String(c.nonCouvert.items),
    note: "au code — aucun contrôle mécanique ne peut le faire" });

  const rec = Object.values(c?.audits || {}).filter(a => a.reconnu);
  if (rec.length) {
    const sev = {}; let tot = 0, sans = 0;
    for (const a of rec) { tot += a.total; sans += a.nonCites;
      for (const [s, n] of Object.entries(a.parSeverite || {})) sev[s] = (sev[s] || 0) + n; }
    // Dire OÙ vivent les 17 : sans la ventilation par fiche, le total ne mène nulle part.
    const par = rec.filter(a => a.total).sort((x, y) => y.total - x.total)
      .map(a => `${versFiche(a.chantier)} ${a.total}`).join(", ");
    l.push({ cle: "constats d'audit ouverts", val: String(tot),
      note: Object.entries(sev).map(([s, n]) => s + n).join(" ") + ` · ${par}`
          + (sans ? ` · ${sans} non cités` : "") });
    /* Le complément de « non cités », et il n'est pas une bonne nouvelle. Le contrôleur
       mesure la CITATION, jamais la prise en charge : un item ouvert qui recense dix
       codes pour dire qu'aucun n'a de plan les cite tous, et rend « non cités : 0 ».
       La ligne est jumelle de « items jamais confrontés » juste au-dessus, et pour la
       même raison — un chiffre inerte qui nomme un travail que rien ne peut faire à
       notre place. Il vaut mieux ici qu'un seuil de recensement : il grandit avec le
       problème au lieu de se déclencher sur une limite qu'aucune mesure ne justifie. */
    const cites = tot - sans;
    if (cites) l.push({ cle: "constats cités, jamais confrontés", val: String(cites),
      note: "à l'item qui les cite — citer n'est pas prendre en charge" });
  }

  const av = c?.avertissements || [];
  return `<h2 class="sec"><span>En attente</span>${
      av.length ? `<span class="n">${av.length} avertissements du contrôleur</span>` : ""}</h2>
    <div class="bord">${l.map(x => `<div class="b-l${x.etat ? " " + x.etat : ""}">
      <span class="b-k">${x.cle}</span>
      <span class="b-v">${x.val}</span>
      ${x.jauge !== undefined ? `<span class="b-j"><i style="--p:${x.jauge}%"></i></span>` : `<span></span>`}
      <span class="b-n">${x.note}</span></div>`).join("")}</div>
    ${!av.length ? "" : `<div class="avs">${
      /* Groupés par FORME du reproche, pas par nom de contrôle. Grouper sur `ctl`
         mettait « aucun tableau reconnu » et « un constat non cité » dans le même
         sac, et n'affichait que l'étiquette du contrôle — le lecteur voyait un nom
         de règle, jamais ce qu'elle reproche. On normalise les nombres et les
         chemins, ce qui reste est la phrase commune. */
      Object.values(av.reduce((g, a) => {
        // Le compte de tête et le chemin d'audit varient d'une fiche à l'autre. Le
        // compte part sur sa fiche plutôt que dans la phrase : « N item(s) ouvert(s) »
        // se lisait comme un gabarit, et l'information par fiche était perdue.
        const n = (a.msg.match(/^(\d+)/) || [])[1] || null;
        const forme = a.msg.replace(/^\d+\s*/, "").replace(/`?docs\/[^\s`:]+`?/g, "l'audit");
        (g[forme] ||= { forme, files: [] }).files.push({ file: a.file, n });
        return g;
      }, {})).sort((x, y) => y.files.length - x.files.length)
        .map(({ forme, files }) => `<div class="av">
          <span class="a-n">${files.length}</span>
          <span class="a-m">${ligne(forme)}</span>
          <span class="a-l">${files.map(({ file, n }) => {
            const c = file.replace(/^.*\//, "").replace(/\.md$/, "");
            return `<a href="#/c/${encodeURIComponent(c)}">${esc(c)}${n ? `<i>${n}</i>` : ""}</a>`;
          }).join(" ")}</span>
        </div>`).join("")}</div>`}`;
}

/* ---------------- accueil ---------------- */
function vueChantiers(){
  if (!D.chantiers.length) return vide(
    `<p>Aucune fiche dans <code>pilotage/</code>.</p>
     <p>Une fiche de chantier est un <code>.md</code> avec un front-matter
     <code>chantier:</code> et <code>statut:</code>, et ses reliquats en cases sous un
     titre <code>## Reste</code>. Le gabarit est dans <code>pilotage/_TEMPLATE.md</code>.</p>`);

  const tri = l => l.sort((a, b) => (a.silence ?? 1e9) - (b.silence ?? 1e9));
  const ven = tri(D.chantiers.filter(c => c.statut === "à venir"));
  const int = tri(D.chantiers.filter(c => c.statut === "interrompu"));
  const dif = tri(D.chantiers.filter(c => c.statut === "différé"));
  const fer = tri(D.chantiers.filter(c => !OUVERT(c.statut)));

  const ech = echelle();
  const carte = c => {
    const r = c.reste.filter(x => !x.fait).length;
    return `<article class="carte s-${slug(c.statut)}">${plaque(c)}
        <div class="corps-c">
          <h3 class="titre-c"><a class="cible"
            href="#/c/${encodeURIComponent(c.code)}">${esc(sansCode(c.titre))}</a></h3>
          ${c.arrete ? `<p class="lemme">${ligne(c.arrete)}</p>` : ""}
          <p class="pied">
            <span class="${r ? "r" : "r0"}">${r ? r + " reste" + (r > 1 ? "s" : "") : "aucun reliquat"}</span>
            ${dementi(c) ? `<span class="nf">${esc(ditDementi(c))}</span>` : ""}
            ${c.dernier ? `<span>${c.dernier.hash} · ${c.dernier.date}</span>` : ""}
            ${c.front ? `<span class="fr${c.front.integre ? "" : " nf"}">${esc(c.front.ref)}</span>` : ""}
          </p>
          ${barreCarte(c, ech)}
        </div>
      </article>`;
  };
  const bloc = (l, t) => !l.length ? "" :
    `<h2 class="sec"><span>${t}</span><span class="n">${l.length}</span></h2>
     <div class="pile">${l.map(carte).join("")}</div>`;

  return bandeVol() + bandeBord()
       + bloc(ven, "À venir — cadrés, pas commencés")
       + bloc(int, "Interrompus — arrêtés en plein travail")
       + bloc(dif, "Différés — fermés volontairement, reliquat connu")
       + (ven.length || int.length || dif.length ? "" : vide(
           `<p>Aucun chantier ouvert — les ${D.chantiers.length} fiches sont closes, livrées ou abandonnées.</p>
            <p>Quand tu en reprends un, repasse son <code>statut:</code> à
            <code>interrompu</code> dans sa fiche et il remontera ici.</p>`))
       /* Le bac des fermés porte trois mots, et ils ne disent pas la même chose : `clos`
          est fait, `livré` est intégré, `abandonné` est décidé non fait. Seuls les deux
          derniers portent un badge — `clos` est le cas ordinaire, il n'a rien à ajouter.
          Un `livré` que le front dément le dit ICI aussi : la carte complète ne s'affiche
          que pour les chantiers ouverts, et une livraison démentie qui ne serait visible
          que sur les cartes ne serait visible nulle part. */
       + (fer.length ? `<h2 class="sec"><span>Clos, livrés et abandonnés</span><span class="n">${fer.length}</span></h2>
           <div class="repli">${fer.map(c =>
             `<a href="#/c/${encodeURIComponent(c.code)}">${esc(c.code)}${
               c.statut === "livré" ? ` <span class="v">livré</span>` : ""}${
               c.statut === "abandonné" ? ` <span class="ab">abandonné</span>` : ""}${
               dementi(c) ? ` <span class="nf">${esc(ditDementi(c))}</span>`
                 : c.front && !c.front.integre ? ` <span class="nf">${esc(c.front.ref)}</span>` : ""}</a>`).join("")}</div>` : "");
}

/* Les items du Reste, groupés par zone `###` s'il y en a. Aucune zone déclarée →
   liste simple, exactement comme avant : une fiche à trois items n'a rien à grouper. */
function zonesReste(c){
  const z = [];
  for (const r of c.reste) {
    const nom = r.zone || null;
    if (!z.length || z[z.length - 1].nom !== nom) z.push({ nom, items: [] });
    z[z.length - 1].items.push(r);
  }
  if (z.length === 1 && !z[0].nom)
    return `<ul class="cases">${c.reste.map(r => item(c.file, r)).join("")}</ul>`;
  return z.map(g => {
    const ouv = g.items.filter(i => !i.fait).length;
    return `${g.nom ? `<h3 class="zone"><span>${esc(g.nom)}</span>
        <span class="n">${ouv} / ${g.items.length}</span></h3>` : ""}
      <ul class="cases">${g.items.map(i => item(c.file, i)).join("")}</ul>`;
  }).join("");
}

/* ---------------- fiche ---------------- */
function vueFiche(code){
  const c = byCode(code);
  if (!c) return `<a class="retour" href="#/">← chantiers</a>` + vide(
    `<p>Aucune fiche pour le code <b>${esc(code)}</b>.</p>
     <p>Les codes connus sont ceux du front-matter <code>chantier:</code> des fichiers
     de <code>pilotage/</code>.</p>`);

  const ouv = c.reste.filter(r => !r.fait).length;
  const passes = c.passes.map(byFile).filter(Boolean);
  const meta = [
    /* « dernier commit » a quitté ce panneau : la traînée le donne avec son sujet,
       juste sous le point de reprise, là où on le lit. */
    c.front && ["intégration", c.front.integre ? esc(c.front.ref)
      : `${esc(c.front.ref)} — absent de ${(D.refs || []).map(esc).join(", ")}`],
    ["silence", `${c.silence ?? "—"} jours actifs`],
    ["commits", String(c.commits)],
    /* dire d'où vient le compte : sans ça, « 71 commits » pour un chantier dont le
       code n'apparaît que 12 fois dans l'historique ressemble à un bug. */
    c.remontee && ["remontée", `${c.remontee.length} codes de constat comptés comme
      <code>${esc(c.code)}</code> — ${c.remontee.slice(0, 2).map(esc).join(", ")}…`],
    c.audit && ["source", pastilles(esc(c.audit))],
    c.portee && ["portée", ditPortee(c.portee)],
    c.collisions && ["collisions", ditCollisions(c.collisions)
      + (c.collisions.length > 3 ? ` <i>+${c.collisions.length - 3} autres</i>` : "")],
    ["fiche", `<a href="${vsc(c.file)}">${esc(c.file)}</a>`]
  ].filter(Boolean);

  return `<a class="retour" href="#/">← chantiers</a>
   <div class="folio s-${slug(c.statut)}">
    <aside class="apparat">${plaque(c)}
      <dl class="meta">${meta.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join("")}</dl>
    </aside>
    <div>
      <h1 class="titre-f">${esc(c.titre)}</h1>
      ${c.arrete ? `<p class="lemme-f"><b>${esc(c.arreteLibelle || libelleDeduit(c))}</b>${ligne(c.arrete)}</p>` : ""}
      ${!c.trainee?.length ? "" : `<ol class="trainee">${c.trainee.map(t => `<li>
        <span class="t-h">${t.hash}</span><span class="t-d">${t.date}</span>
        <span class="t-s">${ligne(t.sujet)}</span></li>`).join("")}</ol>`}

      <h2 class="sec"><span>Reste</span>${c.reste.length
        ? `<span class="n">${c.reste.length - ouv} / ${c.reste.length}</span>` : ""}</h2>
      ${c.reste.length
        ? zonesReste(c)
        : vide(`<p>Aucun reliquat déclaré.</p>
            <p>Si tu trouves du travail restant, ajoute une ligne <code>- [ ]</code> sous
            <code>## Reste</code> dans <a href="${vsc(c.file)}">${esc(c.file)}</a> — elle
            apparaîtra ici, cochable.</p>`)}

      ${passes.length ? `<h2 class="sec"><span>Passes de QA</span></h2>
        <div class="pile">${passes.map(rowPasse).join("")}</div>` : ""}

      ${c.contexte ? `<h2 class="sec"><span>Contexte</span></h2>
        <div class="prose">${prose(c.contexte)}</div>` : ""}
    </div>
   </div>`;
}

const item = (file, r) => {
  const id = `k${file.replace(/\W/g, "")}${r.ligne}`;
  /* Sur un export, la case ne peut RIEN écrire : il n'y a pas de serveur derrière. La
     laisser cliquable afficherait un geste qui échoue — le code reprend la main et
     remet la case en place, mais proposer ce qu'on ne peut pas tenir reste un mensonge
     d'interface. Elle est donc désactivée, et le titre dit pourquoi. */
  const fige = D.statique
    ? ` disabled title="Export en lecture seule — cocher se fait depuis le dépôt"` : "";
  return `<li class="case${D.statique ? " fige" : ""}"><input type="checkbox" id="${id}" ${r.fait ? "checked" : ""}${fige}
    data-file="${esc(file)}" data-ligne="${r.ligne}">
    <label for="${id}">${ligne(r.texte)}</label></li>`;
};

/* ---------------- passes ---------------- */
const etat = p => !p.derniere ? "jamais jouée"
  : p.faits === p.total ? "complète" : `dernière ${p.derniere}`;

const rowPasse = p => `<article class="carte s-clos">
    <div class="plaque">
      <span class="mesure">${p.faits}<i>/ ${p.total}</i></span>
      <span class="mot">${esc(etat(p))}</span>
    </div>
    <div class="corps-c">
      <h3 class="titre-c"><a class="cible"
        href="#/qa/${encodeURIComponent(p.file)}">${esc(p.nom)}</a></h3>
      <p class="pied">
        ${p.chantier ? `<span>chantier ${pastilles(esc(p.chantier))}</span>`
                     : `<span>transversale</span>`}
        ${p.duree ? `<span>${esc(p.duree)}</span>` : ""}
        <span>${p.zones.length} zones</span>
      </p>
    </div>
  </article>`;

function vueQA(){
  if (!D.passes.length) return vide(
    `<p>Aucune passe dans <code>pilotage/qa/</code>.</p>
     <p>Une passe est une procédure <b>rejouable</b>, pas un état. Crée
     <code>pilotage/qa/&lt;nom&gt;.md</code> avec un front-matter <code>passe:</code>,
     et regroupe les points en cases sous des titres <code>###</code> de zone.</p>`);

  const bloc = (l, t) => !l.length ? "" :
    `<h2 class="sec"><span>${t}</span><span class="n">${l.length}</span></h2>
     <div class="pile">${l.map(rowPasse).join("")}</div>`;
  return bloc(D.passes.filter(p => !p.derniere), "Jamais jouées")
       + bloc(D.passes.filter(p => p.derniere), "Déjà jouées");
}

function vuePasse(file){
  const p = byFile(file);
  if (!p) return `<a class="retour" href="#/qa">← passes</a>` + vide(
    `<p>Aucune passe à ce chemin.</p>`);

  return `<a class="retour" href="#/qa">← passes</a>
    <h1 class="titre-f">${esc(p.titre)}</h1>
    <p class="etat" style="margin:0 0 1.5rem">
      ${p.faits} / ${p.total} cochés · ${esc(etat(p))}${p.duree ? " · " + esc(p.duree) : ""}
      ${p.chantier ? " · chantier " + pastilles(esc(p.chantier)) : " · transversale"}
      &nbsp;<button class="bt" id="reset" data-armed="0">réinitialiser</button>
    </p>
    ${p.intro ? `<div class="prose">${prose(p.intro)}</div>` : ""}
    ${p.zones.map(z => `<h3 class="zone">${esc(z.nom)}</h3>
      <ul class="cases">${z.items.map(i => item(p.file, i)).join("")}</ul>`).join("")}`;
}

/* ---------------- fil ---------------- */
let scope = "tout";
function vueFil(){
  if (!D.commits.length) return vide(
    `<p>Aucun commit sur la fenêtre courante.</p>
     <p>Relance le serveur avec une fenêtre plus large :
     <code>npm run journal -- --days 180</code>.</p>`);

  const n = {};
  D.commits.forEach(c => n[c.scope] = (n[c.scope] || 0) + 1);
  const scopes = Object.entries(n).sort((a, b) => b[1] - a[1]);
  const list = D.commits.filter(c => scope === "tout" || c.scope === scope);
  const jours = {};
  list.forEach(c => (jours[c.date] ||= []).push(c));

  return `<div class="filtre">
      <label for="sc">scope</label>
      <select id="sc">
        <option value="tout"${scope === "tout" ? " selected" : ""}>tout (${D.commits.length})</option>
        ${scopes.map(([s, k]) =>
          `<option value="${esc(s)}"${s === scope ? " selected" : ""}>${esc(s)} (${k})</option>`).join("")}
      </select>
    </div>
    ${!list.length ? vide(`<p>Aucun commit pour le scope <b>${esc(scope)}</b>.</p>`) :
      Object.keys(jours).sort().reverse().map(d => `
        <div class="jour">${jour(d)}</div>
        <div class="cmts">${jours[d].map(c => `<div class="cmt">
          <span class="h">${c.hash}</span>
          <span class="s">${ligne(c.sujet)}</span></div>`).join("")}</div>`).join("")}`;
}

/* L'échelle du temps, partagée par la frise et par les barres des cartes. Extraite ici
   parce que deux calculs finiraient par diverger : une barre de carte et une barre de
   frise qui ne diraient pas la même durée seraient pires qu'une seule des deux.

   L'axe part du premier COMMIT, pas du premier document. Mesuré : les dates d'entrée
   d'audits précédaient le travail de 33 jours, un quart de la largeur ne portant aucune
   barre. Le vide qui RESTE à l'intérieur n'est pas comprimé : il n'y en a qu'un, il ne
   rapprocherait qu'un seul chantier, et une échelle brisée détruirait la seule chose que
   ces barres servent à faire — comparer des durées. */
const JOUR = 864e5;
const tps = d => Date.parse(d + "T00:00:00");

function echelle(){
  const toutes = [], travaux = [];
  for (const c of D.chantiers) {
    for (const d of [c.premier?.date, c.dernier?.date, c.auditDate, c.ficheDate]) if (d) toutes.push(d);
    if (c.premier) travaux.push(c.premier.date);
  }
  for (const p of D.passes) for (const d of [p.entree, p.derniere]) if (d) toutes.push(d);
  if (!toutes.length) return null;
  const a = travaux.length ? Math.min(...travaux.map(tps)) : Math.min(...toutes.map(tps));
  const b = Math.max(...toutes.map(tps), tps(D.dernierJour || new Date().toISOString().slice(0, 10)));
  /* Une marge d'un jour de chaque côté : sans elle, le premier commit colle au bord et se
     lit comme une troncature plutôt que comme un début. */
  const lo = a - JOUR, amp = (b + JOUR) - lo;
  return { lo, amp, b,
    avant: d => tps(d) < lo,
    pc: d => Math.max(0, (tps(d) - lo) / amp * 100).toFixed(2) };
}

/* La même barre que sur la frise, posée sur une carte. Sans axe ni étiquette : ce qui se
   lit d'une carte à l'autre est la LONGUEUR et la POSITION, pas une date — la date exacte
   est déjà deux lignes plus haut. Un chantier sans commit n'a pas de piste du tout,
   plutôt qu'une piste vide qui se lirait comme une durée nulle. */
function barreCarte(c, e){
  if (!e || !c.premier) return "";
  const d1 = e.pc(c.premier.date), d2 = e.pc(c.dernier.date);
  return `<span class="mini" title="${esc(c.premier.date)} → ${esc(c.dernier.date)}"><span
    style="left:${d1}%;width:max(3px,${(d2 - d1).toFixed(2)}%)"></span></span>`;
}

/* Les traits de mois d'un axe. Le premier de chaque mois compris dans l'intervalle : les
   mois n'ont pas la même longueur, un dégradé répété ne tomberait pas juste. Le mois du
   début n'a pas son 1er dans l'intervalle — sans le cas `trait:false`, la région la plus
   à gauche reste sans étiquette et on ne sait pas où l'axe commence.
   Extrait de `vueFrise` le 2026-09-02 pour servir aussi l'axe de la progression, qui ne
   couvre pas la même période. */
function jalonsMois(lo, b){
  const out = [];
  const d0 = new Date(lo); d0.setUTCDate(1);
  for (let x = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), 1));
       x.getTime() <= b + JOUR;
       x = new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 1))) {
    const s = x.toISOString().slice(0, 10);
    const nom = x.toLocaleDateString("fr-FR", { month: "short", timeZone: "UTC" });
    if (tps(s) >= lo) out.push({ s, nom, trait: true });
    else if (!out.length && tps(s) + 32 * JOUR > lo)
      out.push({ s: new Date(lo).toISOString().slice(0, 10), nom, trait: false });
  }
  return out;
}

/* ---------------- progression ---------------- */
/* La frise dit QUAND un chantier a vécu. Elle ne dit pas s'il a avancé : une barre de
   deux mois est la même qu'on ait coché trois cases ou trois cents. Ces deux blocs-là
   le disent, au global puis fiche par fiche.

   Axe séparé, et c'est mesuré : la frise couvre le 18 mai → 2 septembre, le dossier
   `pilotage/` n'existe que depuis le 19 août. Posée sur l'axe de la frise, toute la
   progression tenait dans les 13 % de droite. Deux axes étiquetés valent mieux qu'un
   axe commun illisible — au prix qu'il faut dire, sous les deux, ce qu'ils couvrent. */
function progAxe(){
  const p = D.progression || [];
  if (!p.length) return null;
  const lo = tps(p[0][0]) - JOUR;
  const b = tps(D.dernierJour || p[p.length - 1][0]);
  const amp = (b + JOUR) - lo;
  return { lo, b, amp, pc: d => Math.max(0, Math.min(100, (tps(d) - lo) / amp * 100)) };
}

/* Les évènements sont des SOLDES du jour : cocher une case fait −1 ouvert et +1 fait, le
   même jour, dans la même ligne. C'est la somme courante qui donne l'état — l'évènement
   seul ne dit que le mouvement. */
function progSerie(ev){
  const j = new Map();
  for (const [d, , df, dof] of ev) {
    const e = j.get(d) || [0, 0]; e[0] += df; e[1] += dof; j.set(d, e);
  }
  let f = 0, o = 0;
  return [...j.keys()].sort().map(d => {
    const e = j.get(d); f += e[0]; o += e[1];
    return { d, faits: f, total: f + o };
  });
}

/* Un escalier, pas une interpolation. Entre deux commits le compte ne monte pas
   doucement : il ne bouge pas. Une droite entre deux points dessinerait des journées de
   travail qui n'ont pas eu lieu — et il y a des trous réels dans le dossier, les 29 et
   30 août n'ont aucun commit. */
function progChemin(pts, cle, ax, max, h){
  if (!pts.length || !max) return "";
  const y = v => (h - v / max * h).toFixed(2);
  let d = "", py = null;
  for (const p of pts) {
    const x = ax.pc(p.d).toFixed(2), ny = y(p[cle]);
    d += py === null ? `M${x},${ny}` : `L${x},${py}L${x},${ny}`;
    py = ny;
  }
  return d + `L100,${py}`;
}
/* L'aire se referme sur le PREMIER point, pas sur zéro : avant lui il n'y a pas « zéro
   case », il n'y a pas de dossier. Un remplissage parti du bord gauche se lirait comme
   un fond de courbe à plat. */
const progAire = (ch, h, x0) => ch ? `${ch}L100,${h}L${x0.toFixed(2)},${h}Z` : "";

function blocProg(S, ax, max, h){
  const x0 = ax.pc(S[0].d), cT = progChemin(S, "total", ax, max, h);
  return `<path class="pg-tot" d="${progAire(cT, h, x0)}"/>
    <path class="pg-fai" d="${progAire(progChemin(S, "faits", ax, max, h), h, x0)}"/>
    <path class="pg-lig" d="${cT}"/>`;
}

/* Le peuplement du dossier, sur l'axe de la progression pour qu'on lise les deux d'un
   coup : la courbe du haut dit ce qui a été coché, celle du bas combien de chantiers
   étaient ouverts pendant ce temps. C'est le recoupement qui informe — 131 items ouverts
   d'un coup le 25 août ne veut pas dire la même chose selon qu'il y avait huit chantiers
   ou vingt-trois.

   TROIS bandes, pas six. La frise ne distingue pas `interrompu` de `différé` — les deux
   prennent le minium, seul `à venir` a l'outremer et les fermés le noir. Inventer ici une
   teinte que l'autre écran n'a pas ferait deux vocabulaires de couleur pour un seul
   dossier. `différé` est donc replié avec `interrompu`, et la légende le dit.

   Même grammaire que la courbe du dessus : ce qui est fini en bas, ce qui reste au-dessus.
   Sans ça les deux figures se liraient en sens inverse l'une de l'autre. */
function etatsSerie(){
  const e = D.etats || [];
  return e.map(([d, c]) => {
    const fer = (c["clos"] || 0) + (c["livré"] || 0) + (c["abandonné"] || 0);
    const ouv = (c["interrompu"] || 0) + (c["différé"] || 0);
    const ven = c["à venir"] || 0;
    return { d, b1: fer, b2: fer + ouv, b3: fer + ouv + ven, fer, ouv, ven };
  });
}

/* Les boîtes de passage. Une fiche n'est pas seulement une barre : elle CHANGE d'état, et
   ces changements sont datés. Chaque boîte est posée hors de la piste, un trait la
   rattachant à son instant sur l'axe — c'est le trait qui désigne, la boîte qui informe.

   Sur les PASSAGES seulement, pas sur les déclarations. Mesuré : 14 passages réels, contre
   46 moments si l'on compte aussi les entrées de fiche — dont 13 le seul 19 août, jour où
   le dossier est entré dans le dépôt et non jour où treize chantiers ont bougé. Et une
   boîte lisible fait dans les 150 px : la bande en tient huit ou dix, pas cinquante.

   Le rangement en lignes est glouton et calculé AVANT le rendu, ce qui impose une largeur
   fixe par variante — le navigateur ne peut pas nous dire la largeur d'une boîte qui
   n'existe pas encore. */
const CARTE = 3;                                  // 1 court · 2 titré · 3 point de reprise
/* Largeurs et hauteurs relevées à l'écran, pas estimées. Au premier essai la boîte
   courte faisait 13,5 % — soit 115 px pour « interrompu → à venir », vingt caractères de
   chasse fixe : le texte se coupait et débordait sur le rang du dessous. Une ligne de
   boîte tient environ 25 caractères à 20 % de la bande, et c'est la ligne du passage qui
   commande la largeur. La hauteur d'un rang laisse un demi-rem entre deux boîtes. */
const CARTE_L = [0, 20, 25, 28];                  // largeur en % de la bande
const CARTE_H = [0, 4.1, 7.4, 11.6];              // pas d'un rang, en rem

const TEINTE = st => st === "à venir" ? "pb-ven"
  : (st === "clos" || st === "livré" || st === "abandonné") ? "pb-fer" : "pb-ouv";

function vuePassages(ax){
  const P = D.passages || [];
  if (!P.length) return "";
  const parFile = new Map(D.chantiers.map(c => [c.file, c]));
  const LARG = CARTE_L[CARTE], HR = CARTE_H[CARTE];

  /* Le point de reprise décrit où en est le chantier MAINTENANT. Le poser sur chacune de
     ses boîtes le répète — 5 fois sur 17 ici — et surtout le fait mentir : affiché sur un
     passage du 1er septembre, il affirme d'une date passée ce qui n'est vrai que du jour.
     Il ne va donc que sur la dernière boîte de chaque fiche, les précédentes gardant le
     code, le passage, la date et le titre.
     Le rang se prend sur `D.passages`, qui est dans l'ordre des commits, et non sur la
     liste triée : deux passages du même jour sur la même fiche existent — `R2` le 27 août,
     `interrompu → clos` puis `clos → interrompu` — et seul l'ordre d'origine les départage. */
  const rangDernier = new Map();
  P.forEach(([, f], i) => rangDernier.set(f, i));
  const items = P.map(([d, f, av, ap], i) =>
      ({ d, f, av, ap, c: parFile.get(f), x: ax.pc(d), fin: rangDernier.get(f) === i }))
    .sort((a, b) => a.x - b.x || a.f.localeCompare(b.f));

  /* La boîte est centrée sur son instant, sauf aux bords où elle sortirait de la bande —
     elle s'y appuie alors, et c'est le TRAIT qui garde la position vraie. Une boîte
     recadrée ment de quelques pixels ; une boîte à moitié hors champ ne se lit pas. */
  const fins = [];
  for (const it of items) {
    const g = Math.max(0, Math.min(100 - LARG, it.x - LARG / 2));
    let r = 0;
    while (fins[r] !== undefined && g < fins[r] + 0.8) r++;
    fins[r] = g + LARG;
    it.g = g; it.r = r;
  }
  const rangs = Math.max(...items.map(i => i.r)) + 1;

  const corps = it => {
    const c = it.c;
    const n = c ? c.reste.filter(r => !r.fait).length : null;
    const dit = n === null ? "" : n ? `${n} reste${n > 1 ? "s" : ""}` : "soldé";
    const nom = esc(it.f.replace(/^.*\//, "").replace(/\.md$/, ""));
    const haut = `<b>${c ? `<a href="#/c/${encodeURIComponent(c.code)}">${nom}</a>` : nom}</b>`
      + `<span class="pb-p">${esc(it.av)} <i>→</i> ${esc(it.ap)}</span>`
      + `<span class="pb-d">${esc(it.d)}${dit ? " · " + dit : ""}</span>`;
    if (CARTE === 1) return haut;
    const titre = c ? `<span class="pb-ti">${esc(sansCode(c.titre))}</span>` : "";
    if (CARTE === 2) return haut + titre
      + `<span class="pb-n">${c ? c.commits + " commit" + (c.commits > 1 ? "s" : "") : ""}</span>`;
    return haut + titre
      + (it.fin && c && c.arrete ? `<span class="pb-a">${ligne(c.arrete)}</span>` : "");
  };

  const boite = it => `<div class="pb-x ${TEINTE(it.ap)}"
      style="left:${it.g.toFixed(2)}%;width:${LARG}%;top:${(it.r * HR).toFixed(2)}rem"
      title="${esc(it.d)} — ${esc(it.f)} : ${esc(it.av)} → ${esc(it.ap)}">${corps(it)}</div>`;

  const trait = it => `<span class="pb-t" style="left:${it.x.toFixed(2)}%;
      top:${((it.r + 1) * HR - 0.35).toFixed(2)}rem;
      height:${((rangs - it.r - 1) * HR + 0.35).toFixed(2)}rem"></span>`;

  return `<p class="pg-cap">passages de statut <i>${items.length} depuis le ${items[0].d}</i></p>
    <div class="pg pb" style="--rangs:${(rangs * HR).toFixed(2)}rem;--hr:${HR}rem"><span></span>
      <div class="pb-in">${items.map(trait).join("")}${items.map(boite).join("")}</div></div>`;
}

function vueProgression(){
  const ev = D.progression || [];
  const ax = progAxe();
  /* Un écran à lui seul ne peut plus rendre la chaîne vide : sur la frise, l'absence de
     progression laissait simplement la frise. Ici elle laisserait une page blanche. */
  if (!ax || !ev.length) return vide(
    `<p>Aucune progression à retracer : aucun commit n'a encore coché ni ouvert de case
     dans <code>${esc(D.dir || "pilotage")}/</code>.</p>
     <p>La courbe se reconstitue depuis l'historique git du dossier — elle apparaîtra au
     premier commit qui touche une ligne <code>- [ ]</code>.</p>`);
  const S = progSerie(ev), fin = S[S.length - 1], max = fin.total || 1, H = 100;

  const mois = jalonsMois(ax.lo, ax.b);
  const axe = `<div class="fr-axe"><span></span><div>${mois.map(m =>
    `<span class="fr-m${m.trait ? "" : " fr-m0"}" style="left:${ax.pc(m.s).toFixed(2)}%">${esc(m.nom)}</span>`).join("")}</div></div>`;

  /* Chaque fiche est ramenée à SON propre maximum, pas à celui du dossier. Une passe de
     17 points et un chantier de 400 partagent la même hauteur de ligne ; à échelle
     commune, la passe serait un trait plat indiscernable d'un chantier mort. Ce qui se
     lit d'une ligne à l'autre est donc la FORME — quand ça monte, quand ça stagne — et
     le compte exact est écrit à droite. */
  const etiq = new Map();
  for (const c of D.chantiers) etiq.set(c.file, { t: c.code, h: `#/c/${encodeURIComponent(c.code)}`, ch: true });
  for (const p of D.passes) etiq.set(p.file, { t: p.nom, h: `#/qa/${encodeURIComponent(p.file)}`, ch: false });

  const parF = new Map();
  for (const e of ev) { if (!parF.has(e[1])) parF.set(e[1], []); parF.get(e[1]).push(e); }

  const lignes = [...parF].map(([f, l]) => {
    const s = progSerie(l), d = s[s.length - 1];
    return { f, s, faits: d.faits, total: d.total, e: etiq.get(f) };
  }).sort((a, b) => b.total - a.total || a.f.localeCompare(b.f));

  const ligne = r => {
    const n = r.e ? `<a class="pg-c${r.e.ch ? " pg-ch" : ""}" href="${r.e.h}">${esc(r.e.t)}</a>`
      : `<span class="pg-c">${esc(r.f.replace(/^.*\//, ""))}</span>`;
    return `<div class="pg-l">${n}<div class="pg-p"
      title="${esc(r.e ? r.e.t : r.f)} — ${r.faits} faits sur ${r.total} · ${esc(r.f)}"><svg class="pg-s" viewBox="0 0 100 20"
      preserveAspectRatio="none" aria-hidden="true">${blocProg(r.s, ax, r.total || 1, 20)}</svg>
      <i class="pg-n">${r.faits}/${r.total}</i></div></div>`;
  };

  const fond = `<div class="fr-fond">${mois.filter(m => m.trait).map(m =>
    `<span class="fr-mois" style="left:${ax.pc(m.s).toFixed(2)}%"></span>`).join("")}</div>`;

  const E = etatsSerie(), d0 = E[E.length - 1];
  const eMax = Math.max(...E.map(p => p.b3), 1), EH = 52, ex0 = E.length ? ax.pc(E[0].d) : 0;
  const bande = (cle, cls) => `<path class="${cls}"
    d="${progAire(progChemin(E, cle, ax, eMax, EH), EH, ex0)}"/>`;
  /* Peintes de la plus haute à la plus basse : chaque aire recouvre la précédente, ce qui
     donne un empilement franc sans transparence. Superposer des fills translucides
     mélangeait les trois teintes en une bouillie brune dès la deuxième. */
  const etats = !E.length ? "" : `<p class="pg-cap">chantiers ouverts et fermés
      <i>${d0.ven + d0.ouv} ouverts &middot; ${d0.fer} fermés</i></p>
    <div class="pg pg-e"><span></span>${fond}<svg class="et-g" viewBox="0 0 100 ${EH}"
      preserveAspectRatio="none" aria-hidden="true">${
        bande("b3", "et-ven")}${bande("b2", "et-ouv")}${bande("b1", "et-fer")}</svg></div>`;

  return `<h2 class="sec"><span>Progression</span>
      <span class="n">${fin.faits} faits · ${fin.total - fin.faits} restants · ${S[0].d} → ${fin.d}</span></h2>
    <div class="frise">
      <p class="pg-cap">cases cochées</p>
      <div class="pg"><span></span>${fond}
        <svg class="pg-g" viewBox="0 0 100 ${H}" preserveAspectRatio="none"
          aria-hidden="true">${blocProg(S, ax, max, H)}</svg></div>
      ${etats}
      ${vuePassages(ax)}
      ${axe}
      <p class="fr-leg"><b>aire verte</b> les cases cochées &middot; <b>l'aire au-dessus</b>
        ce qui reste ouvert &mdash; l'écart entre les deux EST le reliquat &middot;
        <b>en bas</b> le peuplement du dossier sur le même axe : gris les chantiers fermés,
        rouge ceux en travail &mdash; <i>interrompu</i> et <i>différé</i> ensemble, comme
        sur la frise qui ne les distingue pas non plus &mdash; bleu ceux à venir &middot;
        <b>escalier</b> et non courbe : entre deux commits le compte ne bouge pas
        &middot; les deux lisent l'historique <b>commité</b>, donc ce qui vient d'être
        coché depuis l'écran n'y est pas encore</p>
      <p class="fr-leg">Chaque ligne ci-dessous est ramenée à <b>son propre maximum</b> :
        la hauteur du vert est la fraction faite, et c'est la forme qui se compare d'une
        ligne à l'autre, pas la hauteur.</p>
      <div class="pg-liste">${lignes.map(ligne).join("")}</div>
    </div>`;
}

/* ---------------- frise ---------------- */
/* Ce que la carte d'un chantier ne peut pas dire : sa FORME dans le temps. Mesuré sur
   quinze fiches, deux chantiers affichaient une carte identique — même statut, silence
   comparable — alors que l'un était un sprint de trois jours abandonné deux mois plus
   tôt et l'autre une tresse de deux mois avançant d'un commit par semaine. Le dernier
   commit seul ne distingue pas les deux ; les deux bornes, si.
   Pas de liens entre chantiers : la relation qui existe entre eux est la collision de
   fichiers, elle se dérive et ne se dessine pas en graphe. */
function vueFrise(){
  const e = echelle();
  if (!e) return vide(
    `<p>Rien à situer dans le temps : aucun commit ne cite un code de chantier, et
     aucune fiche n'est encore entrée dans le dépôt.</p>`);
  const { lo, b, avant, pc } = e;
  const t = tps;

  const mois = jalonsMois(lo, b);

  const ordre = D.chantiers.slice().sort((x, y) =>
    String(x.premier?.date || x.ficheDate || "9999").localeCompare(String(y.premier?.date || y.ficheDate || "9999")));

  const marque = (d, cls, quoi) => !d ? "" :
    `<span class="${cls}${avant(d) ? " fr-avant" : ""}" style="left:${pc(d)}%"
       title="${esc(quoi)} ${esc(d)}${avant(d) ? " — hors champ, avant le premier commit" : ""}"></span>`;

  /* Les deux bornes sont remises dans l'ordre avant de tracer. Une passe peut porter une
     `derniere` ANTÉRIEURE à l'entrée de son fichier — elle existait avant d'être migrée
     dans le dossier — et la soustraction sortait alors une largeur négative, donc une
     barre de 3 px posée du mauvais côté de sa propre date. Mesuré sur une passe de juillet
     migrée en août. */
  const barre = (dA, dB, cls, titre) => {
    if (!dA && !dB) return "";
    const [d1, d2] = [dA || dB, dB || dA].sort();
    return `<span class="${cls}" style="left:${pc(d1)}%;width:max(3px,${(pc(d2) - pc(d1)).toFixed(2)}%)"
       title="${esc(titre)}"></span>`;
  };

  const ligne = c => {
    const p1 = c.premier?.date, p2 = c.dernier?.date;
    const t = `<div class="fr-t">${
      p1 ? barre(p1, p2, "fr-b", `${p1} → ${p2} · ${c.commits} commit${c.commits > 1 ? "s" : ""}`) : ""
      }${marque(c.ficheDate, "fr-f", "fiche écrite le")}${marque(c.auditDate, "fr-a", "audit entré le")}</div>`;
    return `<div class="fr-l s-${slug(c.statut)}">
      <a class="fr-c" href="#/c/${encodeURIComponent(c.code)}">${esc(c.code)}</a>${t}</div>`;
  };

  /* Une passe se range SOUS son chantier : c'est déjà la relation que porte son propre
     `chantier:`, et la poser en glyphe de plus sur la ligne du chantier les empilait —
     trois passes de R3, dont deux à la même date. Sa barre va de son entrée à sa
     dernière rejoue : une passe écrite il y a deux mois et rejouée hier ne raconte pas
     la même chose qu'une passe écrite et jouée le même jour. */
  const ligneP = p => `<div class="fr-l fr-lp">
    <a class="fr-c" href="#/qa/${encodeURIComponent(p.file)}">${esc(p.nom)}</a>
    <div class="fr-t">${barre(p.entree, p.derniere, "fr-q",
      `${p.entree || "?"} → ${p.derniere || "jamais rejouée"} · ${p.faits}/${p.total}`)}</div></div>`;

  /* La progression a quitté cet écran pour le sien. Elle y avait doublé la hauteur de la
     page : la seule bande des passages fait 92,8 rem — près de 1 500 px — et repoussait la
     frise sous deux écrans de défilement. Deux questions distinctes, deux onglets : la
     frise situe un chantier dans le temps, la progression dit si ça avance. */
  return `<h2 class="sec"><span>Étendue</span><span class="n">${
        new Date(lo).toISOString().slice(0, 10)} → ${D.dernierJour || "?"}</span></h2>
    <div class="frise">
    <div class="fr-corps">
      <div class="fr-fond">${mois.filter(m => m.trait).map(m => `<span class="fr-mois" style="left:${pc(m.s)}%"></span>`).join("")}</div>
      ${ordre.map(c => ligne(c) + D.passes.filter(p => p.chantier === c.code).map(ligneP).join("")).join("")}
      ${D.passes.filter(p => !p.chantier).map(ligneP).join("")}
    </div>
    <div class="fr-axe"><span></span><div>${
      mois.map(m => `<span class="fr-m${m.trait ? "" : " fr-m0"}" style="left:${pc(m.s)}%">${esc(m.nom)}</span>`).join("")}</div></div>
    <p class="fr-leg"><b>barre pleine</b> premier &rarr; dernier commit de travail, la
      tenue du dossier exclue &middot; <b>point bleu</b> une passe de QA, de son entrée
      à sa dernière rejoue &mdash; souvent un point plutôt qu'une barre, la
      passe étant écrite et jouée dans la même semaine &middot;
      <b>losange</b> la fiche entre dans le dépôt &middot; <b>trait fin</b>
      l'audit entre dans le dépôt &middot; un repère <b>ouvert au bord
      gauche</b> est antérieur au premier commit, donc hors champ</p>
  </div>`;
}

/* ---------------- masses ---------------- */
/* Une courbe par aire, normalisée sur elle-même : les masses vont de 1 170 à 28 655
   lignes, une échelle commune écraserait tout sauf les deux plus grosses. */
function courbe(v, w = 132, h = 26){
  if (v.length < 2) return "";
  const lo = Math.min(...v), hi = Math.max(...v), amp = hi - lo || 1;
  const pts = v.map((n, i) =>
    `${(i * w / (v.length - 1)).toFixed(1)},${(h - 1 - (n - lo) / amp * (h - 2)).toFixed(1)}`).join(" ");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${pts}"/></svg>`;
}

function vueMasses(){
  const m = D.masses;
  if (!m || !m.aires.length) return vide(
    `<p>Aucune masse mesurable — <code>git log --numstat</code> n'a rien rendu.</p>`);

  const sgn = n => (n > 0 ? "+" : "") + n.toLocaleString("fr-FR");
  return `<h2 class="sec"><span>Masses de code</span>
      <span class="n">${m.mois[0]} → ${m.mois[m.mois.length - 1]}</span></h2>
    <table class="masses">
      <thead><tr><th>aire</th><th></th><th>lignes</th><th>${m.fenetre} mois</th></tr></thead>
      <tbody>${m.aires.map(a => `<tr>
        <td class="a">${esc(a.nom)}</td>
        <td class="c">${courbe(a.valeurs)}</td>
        <td class="v">${a.total.toLocaleString("fr-FR")}</td>
        <td class="v ${a.delta < 0 ? "moins" : ""}">${sgn(a.delta)}</td>
      </tr>`).join("")}</tbody>
    </table>
    ${!m.jalons.length ? "" : `
      <h2 class="sec"><span>Jalons</span><span class="n">retraits de plus de 1 000 lignes</span></h2>
      <div class="cmts">${m.jalons.map(j => `<div class="cmt jal">
        <span class="h">${j.delta.toLocaleString("fr-FR")}</span>
        <span class="s">${ligne(j.sujet)}<i>${j.hash} · ${j.date}</i></span></div>`).join("")}</div>`}`;
}

/* ---------------- routage ---------------- */
function rendre(){
  const h = decodeURIComponent(location.hash.slice(2) || "");
  const vue = document.getElementById("vue");
  let html, onglet = "#/";
  if (h.startsWith("c/"))       html = vueFiche(h.slice(2));
  else if (h === "qa")          { html = vueQA();               onglet = "#/qa"; }
  else if (h.startsWith("qa/")) { html = vuePasse(h.slice(3));  onglet = "#/qa"; }
  else if (h === "fil")         { html = vueFil();              onglet = "#/fil"; }
  else if (h === "frise")       { html = vueFrise();           onglet = "#/frise"; }
  else if (h === "progression") { html = vueProgression();     onglet = "#/progression"; }
  else if (h === "masses")      { html = vueMasses();           onglet = "#/masses"; }
  else                          html = vueChantiers();

  vue.innerHTML = bandePerime() + html;
  document.querySelectorAll("#tabs a").forEach(a =>
    a.classList.toggle("on", a.getAttribute("href") === onglet));

  vue.querySelectorAll("input[type=checkbox]").forEach(cb => cb.addEventListener("change", cocher));
  const sc = document.getElementById("sc");
  if (sc) sc.addEventListener("change", () => { scope = sc.value; rendre(); });
  const rz = document.getElementById("reset");
  if (rz) rz.addEventListener("click", () => armer(rz, h.slice(3)));
}

/* ---------------- écritures ---------------- */
async function poster(url, corps){
  const r = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" },
                               body: JSON.stringify(corps) });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || `HTTP ${r.status}`);
}

async function cocher(ev){
  const cb = ev.target, { file, ligne } = cb.dataset, avant = !cb.checked;
  try {
    await poster("/cocher", { file, ligne: Number(ligne), fait: cb.checked });
    await charger();
    toast("écrit dans " + file);
  } catch (e) {
    cb.checked = avant;                       // remise dans l'état précédent
    toast(e.message, true);
  }
}

/* confirmation en deux temps — pas de dialogue natif */
let tArm;
function armer(bt, file){
  if (bt.dataset.armed === "1"){ clearTimeout(tArm); return reinit(file); }
  const p = byFile(file); if (!p) return;
  bt.dataset.armed = "1"; bt.classList.add("danger");
  bt.textContent = `décocher les ${p.total} cases — confirmer`;
  tArm = setTimeout(() => {
    bt.dataset.armed = "0"; bt.classList.remove("danger"); bt.textContent = "réinitialiser";
  }, 4000);
}

async function reinit(file){
  try {
    await poster("/reinitialiser", { file });
    await charger();
    toast("passe réinitialisée — l'état précédent reste dans git");
  } catch (e) { toast(e.message, true); }
}

let tT;
function toast(m, ko){
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.toggle("ko", !!ko); t.classList.add("on");
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ---------------- chargement ---------------- */
/* Empreinte de la charge, `genere` retiré : cet horodatage change à CHAQUE construction,
   donc comparer les charges brutes conclurait toujours « ça a bougé ». Tout le reste est
   dérivé du dépôt et ne varie que quand le dépôt varie. */
const signature = j => { const { genere, ...reste } = j; return JSON.stringify(reste); };
let SIGNE = null;

/* `discret` : on revient dans la fenêtre, on redemande la charge, et on ne redessine que
   si quelque chose a changé — sinon un simple aller-retour repeindrait la page et
   perdrait la position de lecture pour rien. */
async function charger(discret){
  const r = await fetch("journal.json", { cache:"no-store" });
  const j = await r.json();
  const sg = signature(j);
  if (discret && sg === SIGNE) return false;
  SIGNE = sg;
  D = j; RXL = null;
  document.getElementById("repo").textContent = D.repo;
  document.getElementById("br").textContent = D.branche;
  /* Les autres journaux ouverts. Des liens en dur vers leur port : chaque serveur reste
     un dépôt, et passer de l'un à l'autre est une navigation, pas un changement d'état
     interne. Rien ne s'affiche quand on est seul — un sélecteur à une entrée est du
     bruit. Le port apparaît en second : c'est ce qu'on retient quand on cherche à
     revenir, et ça distingue deux clones du même dépôt. */
  /* Un export dit ce qu'il est et de quand il date. Sans ça, une page ouverte depuis un
     signet ressemble à s'y méprendre au journal vivant, et on lit un état d'il y a trois
     semaines en le croyant courant. */
  if (D.statique && !document.querySelector(".fige-bandeau")) {
    const d = new Date(D.genere);
    document.getElementById("sil").insertAdjacentHTML("afterend",
      `<p class="fige-bandeau">Export en lecture seule — état du ${jour(D.genere.slice(0, 10))}`
      + ` à ${String(d.getHours()).padStart(2, "0")}h${String(d.getMinutes()).padStart(2, "0")}.`
      + ` Les cases se cochent depuis le dépôt.</p>`);
  }
  document.getElementById("voisins").innerHTML = (D.voisins || []).length
    ? `<span class="sep">·</span>` + D.voisins.map(v =>
        `<a class="voisin" href="http://127.0.0.1:${v.port}/" title="${esc(v.racine)}">${esc(v.nom)}<i>${v.port}</i></a>`).join("")
    : "";
  document.getElementById("sil").textContent = D.dernierJour
    ? `dernier commit le ${jour(D.dernierJour)} — il y a ${D.silenceCourant} jours`
    : "aucun commit";
  const y = window.scrollY;
  rendre();
  if (discret) window.scrollTo(0, y);      // le redessin remet la page en haut
  return true;
}

addEventListener("hashchange", rendre);

/* La page lisait le dépôt UNE fois, à l'ouverture. Changer d'onglet ne redemandait rien —
   `hashchange` redessine depuis les données en mémoire — et seule une case cochée
   rappelait `charger()`. Un chantier clos dans l'éditeur puis commité laissait donc la
   page sur un état périmé, sans que rien ne le dise : l'écran restait plausible, ce qui
   est la pire forme d'erreur pour un outil qui prétend mesurer.
   Le retour dans la fenêtre est le bon déclencheur : on quitte le journal pour travailler,
   on y revient pour regarder. Pas de sondage — il n'y a rien à surveiller entre deux
   coups d'œil. `visibilitychange` couvre le changement d'onglet, `focus` le passage d'une
   fenêtre à l'autre où le premier ne part pas toujours ; le plancher de deux secondes
   empêche les deux de se déclencher en double, la construction de la charge coûtant une
   bonne seconde au serveur. */
let VU = Date.now();
const revenu = () => {
  if (document.visibilityState !== "visible" || Date.now() - VU < 2000) return;
  VU = Date.now();
  charger(true).catch(() => {});
};
addEventListener("visibilitychange", revenu);
addEventListener("focus", revenu);
charger().catch(() => {
  document.getElementById("vue").innerHTML = vide(
    /* Ce message a dit DEUX faussetés à la fois, et un lecteur les a rencontrées.
       La commande d'abord : `node journal.mjs` datait du temps où l'outil vivait dans le
       dépôt qu'il observe. Depuis l'extraction il est une dépendance, le fichier n'est
       plus à la racine, et la consigne renvoyait un MODULE_NOT_FOUND à qui la suivait.
       Une instruction survit à ce qu'elle décrit sans que rien ne le signale.
       La cause ensuite : ce `catch` enveloppe tout `charger()`, rendu compris. Une
       exception dans une vue — un `const` masquant une fonction, vécu le 2 septembre —
       affiche donc « impossible de joindre le serveur » alors qu'il répond en 1,2 s. Le
       texte ne prétend plus savoir laquelle des deux s'est produite. */
    `<p>Le journal n'a pas pu construire sa page.</p>
     <p>Si le serveur est arrêté, relance-le par <code>npm run journal</code> à la racine
     du dépôt, puis recharge. S'il tourne, l'erreur est dans la page elle-même et la
     console du navigateur la nomme.</p>`);
});
</script>
